<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f1efe8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<title>Ride Dispatch</title>
<meta name="asset-version" content="{{ asset_version }}">
<link rel="preload" as="font" type="font/woff2" href="{{ asset('fonts/B612Mono-Regular.woff2') }}" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="{{ asset('fonts/B612Mono-Bold.woff2') }}" crossorigin>
<link rel="stylesheet" href="{{ asset('css/base.css') }}">
<link rel="stylesheet" href="{{ asset('css/order-sheet.css') }}">
<link rel="stylesheet" href="{{ asset('css/day.css') }}">
<link rel="stylesheet" href="{{ asset('css/settle.css') }}">
</head>
<body>
<button class="shell-banner" id="banner-auth" hidden>登入過期 · 撳呢度重新登入</button>
<button class="shell-banner" id="banner-update" hidden>有新版本 · 撳呢度更新</button>
<div id="view-day" class="view view-day" hidden>
<div class="header">
  <div class="header-row">
    <button class="date-btn" id="dateBtn" onclick="rd.day.goToday()"></button>
    <div class="keys">
      <button class="nav-btn" onclick="rd.day.go(-1)" aria-label="前一日">&larr;</button>
      <button class="nav-btn" onclick="rd.day.go(1)" aria-label="後一日">&rarr;</button>
      <a class="icon-btn" href="/settle" data-nav aria-label="埋數">$</a>
      <button class="icon-btn add-btn" onclick="rd.day.openAdd()" aria-label="入單">+</button>
    </div>
  </div>
  <div class="tabs" id="day-tabs" role="group" aria-label="平台"></div>
  <div class="cols" aria-hidden="true"><span>時間</span><span>班次</span><span>地點</span><span>車費</span></div>
</div>
<div class="orders" id="orders"></div>
<div class="foot"><div class="foot-in" id="day-foot"></div></div>
<div class="scrim" id="day-scrim" onclick="rd.day.closeOverlays()"></div>
<div class="drop board" id="day-drop"></div>
<div class="sheet board" id="day-sheet"></div>
</div>
<div id="view-settle" class="view view-settle" hidden>
<div class="header">
  <div class="header-row">
    <button class="date-btn" id="monthBtn"></button>
    <div class="keys">
      <button class="nav-btn" id="prevM" aria-label="前一個月">&larr;</button>
      <button class="nav-btn" id="nextM" aria-label="後一個月">&rarr;</button>
      <button class="icon-btn stmt-btn" id="stmtBtn" aria-label="讀結算圖">圖</button>
      <a class="icon-btn" href="/" data-nav aria-label="返日程">&#10005;</a>
    </div>
  </div>
  <div class="tabs" id="settle-tabs" role="group" aria-label="平台"></div>
  <!-- Written here, not by the script, so the header has its full height
       before the first answer lands: the strip is placed against its bottom
       edge. -->
  <div class="lens" id="settle-lens" role="group" aria-label="本月總數">
    <button class="lkey on" data-lens="fare" aria-pressed="true"><span class="k">本月車費</span><span class="v">&mdash;</span><i class="mk"></i></button>
    <button class="lkey st-received" data-lens="received" aria-pressed="false"><span class="k">已收</span><span class="v">&mdash;</span><i class="mk"></i></button>
    <button class="lkey st-received" data-lens="awaiting" aria-pressed="false"><span class="k">等過數</span><span class="v">&mdash;</span><i class="mk"></i></button>
    <button class="lkey st-received" data-lens="unsettled" aria-pressed="false"><span class="k">未結算</span><span class="v">&mdash;</span><i class="mk"></i></button>
  </div>
  <div class="cols wk" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
</div>
<div class="cal">
  <!-- The colour key is read once and sits above the strip: the strip has no
       end to put it after, since scrolling to either end loads another month. -->
  <div class="legend">
    <span><i class="sw owed"></i>平台欠緊（未結算 · 差數）</span>
    <span><i class="sw open"></i>入數未對</span>
    <span><i class="sw short"></i>入數已對但批次仍差</span>
    <span><i class="sw wait"></i>等過數</span>
    <span><i class="sw paid"></i>已收</span>
    <span><i class="sw done"></i>已對／收埋</span>
    <span><i class="sw held"></i>補結／舉牌先結</span>
  </div>
  <div class="sent" id="sentTop"></div>
  <div class="weeks" id="grid"></div>
  <div class="sent" id="sentBot"></div>
</div>
<div class="foot"><div class="foot-in" id="settle-foot"></div></div>
<div class="scrim" id="settle-scrim"></div>
<div class="sheet board" id="settle-sheet"></div>
<div class="drop" id="settle-drop"><span>放低張結算圖</span></div>
<input type="file" id="stmtFile" accept="image/*" hidden>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="{{ asset('js/main.js') }}"></script>
</body>
</html>
