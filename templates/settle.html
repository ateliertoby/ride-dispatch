<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>埋數 · Ride Dispatch</title>
<style>
{% include "_shared.css" %}
  /* This page has native date inputs, whose built-in widgets follow
     color-scheme rather than the tokens. */
  :root { color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; } }
  body { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
  .empty { padding: 28px 0 8px; }
  .sum-rows { padding: 8px 0 0; }
  /* Sheets here stack (day -> batch -> undo), so the head carries a back
     button and the title has to yield width to it. */
  .sheet-head { gap: 10px; }
  .sheet-title { flex: 1; min-width: 0; }
  .sheet-x, .sheet-back { flex-shrink: 0; }
  .sheet-back {
    background: var(--key-bg); border: none; border-radius: 50%;
    width: 32px; height: 32px; color: var(--text-2); cursor: pointer;
    font-size: 21px; line-height: 30px; padding: 0 2px 2px 0;
  }
  .ghost-btn:active { background: var(--key-press); }

  /* ---- week strip ----
     One continuous run of weeks rather than a month at a time: a week row can
     hold the end of one month and the start of the next, and money settled on
     the last day of a month is paid in the one after it. */
  .cal { padding: 8px 14px 4px; }
  /* minmax(0, 1fr): WebKit lets a grid track grow past its share when an item
     is wider than the column, which would push the seventh day off screen. */
  .wk, .grid, .lane { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .wk span { text-align: center; font-size: 11px; color: var(--text-3); }
  /* Everything that labels the strip rides in the sticky header, because the
     strip grows at both ends: scrolling up prepends months, so anything left
     above the first week row can never be scrolled back to. */
  .header .chips { padding: 10px 0 2px; }
  .header .wk { padding: 8px 0 0; }
  /* The strip's own ends, watched to know when to load the month past them.
     Zero height is skipped by some observers, so they keep a pixel. */
  .sent { height: 1px; }
  /* Where one month gives way to the next. The strip carries no month heading
     -- that is the point: a batch straddling the boundary stays one bar -- so
     the break is a hairline, and the 1st names its month in its own corner
     label. */
  .wkblock.mstart { border-top: 1px solid var(--line); padding-top: 4px; }
  .cell {
    position: relative; min-height: 56px; border: none; border-radius: 10px;
    background: var(--surface); cursor: pointer;
    /* The day number is a corner label pinned top-left, not part of the
       centred content, so the amount is centred in the band below it. Without
       that offset it centres against the whole cell and reads as sitting high
       with dead space underneath. */
    padding: 13px 3px 5px;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; color: inherit; min-width: 0; overflow: hidden;
  }
  /* A day with no orders carries no money and no decision, so it recedes to
     little more than a calendar coordinate. A day in a month the strip has not
     loaded yet reads the same way and fills in when that month arrives.
     Transparent to the pointer as well as inert: a disabled button swallows a
     click rather than letting it through, and these days are the largest part
     of what reads as blank calendar -- which is where a tap lands to put a
     focus down. */
  .cell.none { --o-state: .35; cursor: default; pointer-events: none; }
  .cell .d {
    position: absolute; top: 4px; left: 6px;
    font-size: 11px; line-height: 13px; font-weight: 600; color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }
  .cell .amt {
    font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums;
    letter-spacing: -.2px;
  }
  /* One rule: amber is money no statement has claimed yet. Money already on a
     statement is a record, so it recedes and the bar under the cell carries
     its state instead. A future day has nothing to claim yet, so it is faint. */
  .cell .amt.unsettled { color: var(--amber); }
  .cell .amt.done { color: var(--text-3); }
  .cell .amt.future { color: var(--text-3); opacity: .5; }
  .cell.today .d { color: var(--text); }
  .cell.today { box-shadow: inset 0 0 0 1px var(--text-3); }
  .cell:not(.none):active { background: var(--surface-press); }

  /* ---- event lanes ----
     Under each week's cells, one grid holding every batch segment and credit
     chip of that week, each placed on the lane row the packer gave it. */
  .wkblock { padding-bottom: 4px; }
  .lane { padding-top: 3px; grid-auto-rows: 18px; row-gap: 3px; }
  /* An event reserves however many columns its label needs, but the coloured
     fill belongs to the days the batch actually covers, so the two are
     separate boxes: the slot is the reservation and repeats the lane's own
     column track, and the bar is placed on the days inside it. */
  .slot { display: grid; gap: 4px; min-width: 0; }
  .bar {
    height: 18px; border-radius: 5px; border: none; padding: 0 5px; min-width: 0;
    font-family: inherit; font-size: 11px; font-weight: 650;
    font-variant-numeric: tabular-nums; letter-spacing: -.2px;
    display: flex; align-items: center; cursor: pointer;
    overflow: visible; white-space: nowrap;
  }
  .bar.awaiting { background: var(--key-bg); color: var(--text); }
  /* The label of a part-paid bar prints over both halves of its gradient, so
     it takes the neutral text colour rather than the state's own. */
  .bar.partial { background: var(--banner-bg); color: var(--text); }
  /* A collected batch is a record, not a task, so it holds its fill but stops
     shouting as loudly as the amber ones. */
  .bar.paid { background: var(--paid-bg); color: var(--green); font-weight: 600; --o-state: .8; }
  /* A batch cut by the week boundary squares off the cut end, so the two
     segments read as one bar wrapping. */
  .bar.cut-r { border-top-right-radius: 1px; border-bottom-right-radius: 1px; }
  .bar.cut-l { border-top-left-radius: 1px; border-bottom-left-radius: 1px; }
  /* A held-back day keeps the state colour but drops the fill, so it reads as
     a pointer at the run carrying the amount rather than a batch of its own. */
  .bar.makeup { background: none; border: 1px dashed currentColor; padding: 0 3px; }
  /* A dashed pointer has no fill to print over, so it keeps the state colour
     its border is drawn from. */
  .bar.partial.makeup { color: var(--banner-fg); }
  /* An event sitting on the last column reserves its room to the left, so its
     label has to leave the fill leftwards as well. */
  .bar.spill-l { justify-content: flex-end; }
  .bar:active { filter: brightness(1.15); }
  /* A credit is an outline, not a fill: money arriving from outside the batch
     never reads as one of the bars. A matched one is a record and dims away;
     only a credit still waiting for a statement carries its colour at full. */
  .cchip {
    height: 18px; border-radius: 5px; background: none;
    border: 1px solid var(--green); color: var(--green); --o-state: .55;
    font-family: inherit; font-size: 10.5px; font-weight: 650;
    font-variant-numeric: tabular-nums; letter-spacing: -.2px;
    padding: 0 2px; min-width: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; white-space: nowrap;
    /* The pill is exactly its figure wide and sits at the start of its
       reservation, so its edge stays under the day it arrived on. */
    width: max-content; max-width: 100%; justify-self: start;
  }
  .cchip.spill-l { justify-self: end; }
  .cchip.open { border-color: var(--blue); color: var(--blue); --o-state: 1; }
  .cchip.gone { border-color: var(--text-3); color: var(--text-3); --o-state: .5; }
  /* Money that has been put against a batch which is still short: the credit
     is done with but the account it paid into is not, so the chip wears the
     colour of what is owed instead of dimming away as a record. */
  .cchip.short { border-color: var(--amber); color: var(--amber); --o-state: 1; }

  /* ---- focus ----
     One money relation at a time: a bank credit and the batches it paid, or a
     batch and the credits that paid it. The two ends can be weeks apart on the
     strip and are rarely on screen together, so the link is drawn by opening a
     gap around the relation rather than by a connector that would have nothing
     to run along. The gap is opened from both sides and gently from each:
     everything unrelated recedes, the relation itself lifts, and a receded
     figure stays money the operator can still read at a glance.

     Receding works on the strength each state already chose rather than
     replacing it -- dim is a ceiling, lit is a floor -- so a record stays
     quieter than an open one at both ends and nothing is made louder by being
     pushed away. Every rule above wanting a strength of its own therefore sets
     --o-state rather than opacity. */
  .cell, .bar, .cchip {
    opacity: clamp(var(--o-lit, 0), var(--o-state, 1), var(--o-dim, 1));
    transition: opacity .12s ease, box-shadow .12s ease, background-color .12s ease;
  }
  .cell.dim, .bar.dim, .cchip.dim { --o-dim: .58; }
  .cell.lit, .bar.lit, .cchip.lit { --o-lit: .85; }
  /* A lit surface has to read against the ground it sits on: on dark it can
     brighten, on light it is already white and rises by casting instead. */
  :root {
    --lit-surface: var(--surface-press);
    --lit-cast: 0 0 0 1px color-mix(in srgb, var(--text) 10%, transparent);
  }
  @media (prefers-color-scheme: light) {
    :root { --lit-surface: var(--surface); --lit-cast: 0 1px 3px rgba(16,24,40,.15); }
  }
  .cell.lit { background: var(--lit-surface); box-shadow: var(--lit-cast); }
  /* Today keeps its ring: the lift is on top of what the cell already says. */
  .cell.today.lit { box-shadow: inset 0 0 0 1px var(--text-3), var(--lit-cast); }
  /* A bar or chip is an object on the lane rather than a surface, so it lifts
     by haloing in the colour it already wears -- state, never a hue of its
     own. */
  .bar.lit, .cchip.lit { box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 20%, transparent); }
  .legend { padding: 0 2px 8px; font-size: 11px; line-height: 1.7; color: var(--text-3); }

  /* ---- sheet contents ---- */
  /* The batch sheet is read for its money on every open and for its order
     numbers only when tracing a problem, so the figure leads at hero size and
     the list sits behind a count. */
  .hero { padding: 12px 2px 10px; border-bottom: 1px solid var(--line); }
  .hero-k { font-size: 12px; color: var(--text-2); }
  .hero-v { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.5px; line-height: 1.2; }
  .hero-s { font-size: 14px; font-weight: 650; color: var(--text-2); padding-top: 2px; }
  .hero-s.paid { color: var(--green); }
  .hero-s.warn { color: var(--amber); }
  .hero-s.blue { color: var(--blue); }
  .fold {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 12px 2px; font-family: inherit; font-size: 15px; color: var(--text-2); cursor: pointer;
  }
  .fold .c { color: var(--text-3); font-size: 13px; }
  .fold:active { background: var(--surface-press); }
  .oday {
    font-size: 12px; font-weight: 650; color: var(--text-3);
    padding: 14px 2px 4px; font-variant-numeric: tabular-nums;
  }
  /* A leg row. In a batch it is a read -- a batch is created from a statement
     image in the bot, so there is nothing there to tick -- and the order
     number inside it is the tap that copies. */
  .orow {
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--line); padding: 11px 2px;
  }
  /* In a short-paid batch the same row is the operator's answer to which leg
     was not paid, so the whole row is the target, not just the box. */
  .orow.tick { cursor: pointer; }
  .orow.tick:active { background: var(--surface-press); }
  /* In the day sheet the row is the way into the order it stands for, so the
     row is the target and the number inside it is not a second one. */
  .orow.tap { cursor: pointer; }
  .orow.tap:active { background: var(--surface-press); }
  .orow.tap .oid { cursor: inherit; }
  .ot { width: 44px; flex-shrink: 0; font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .ol { flex: 1; min-width: 0; }
  /* Reconciling is done number by number against the platform's statement, so
     the order number is the line the row is read by; the label under it only
     jogs the memory of which leg that was.
     Negative margins keep the digits flush with the label while the padding
     gives the tap something to land on, and wrapping anywhere keeps a
     19-digit number inside the row instead of widening the sheet. Tapping the
     number copies it wherever it carries the copy target. */
  .oid {
    display: inline-block; margin: 0 -6px; padding: 2px 6px 1px;
    font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums;
    letter-spacing: .2px; overflow-wrap: anywhere; cursor: pointer;
  }
  .oid:active { color: var(--text-2); }
  .oll { display: block; font-size: 11px; color: var(--text-3); }
  .oa { flex-shrink: 0; font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .omark {
    flex-shrink: 0; font-size: 11px; font-weight: 650; padding: 2px 6px; border-radius: 5px;
    background: var(--banner-bg); color: var(--banner-fg);
  }
  .oplat { color: var(--amber); font-size: 0.85em; margin-left: 4px; }
  /* A fine already netted into the figure beside it, so it explains a number
     rather than warning about one — same shape as .oplat, the colour of money
     going out. */
  .ofine { color: var(--red); font-size: 0.85em; margin-left: 4px; }
  /* A leg the platform held back and paid later is a record, not a warning:
     same shape as the 未過數 mark, the colour of money that has arrived. */
  .omark.paid { background: var(--paid-bg); color: var(--green); }
  .sum-row a { color: var(--amber); text-decoration: none; }
  /* An allocation row hands the operator to the credit that paid it, so it is
     a button wearing the same shape as the rows around it. */
  .sum-row.link {
    width: 100%; background: none; border: none; font: inherit; color: inherit;
    cursor: pointer; text-align: left;
  }
  .sum-row.link:active { background: var(--surface-press); }
  /* Taking money back off a batch cannot live inside the row that opens the
     credit -- a control inside a control -- so the two sit side by side. */
  .alloc { display: flex; align-items: center; gap: 6px; }
  .alloc .sum-row.link { flex: 1; min-width: 0; }
  .xbtn {
    flex-shrink: 0; background: none; border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 9px; font-family: inherit; font-size: 12px;
    color: var(--text-3); cursor: pointer;
  }
  .xbtn:active { background: var(--surface-press); }
  .sum-row .c { color: var(--text-3); margin-left: 6px; }
  /* In the day sheet the amount is never the answer on its own -- $500 already
     collected and $500 still owed are the same number -- so every leg carries
     its state under the amount, in the same colours the calendar uses. */
  .oend { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .otag { font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .otag.unsettled { color: var(--amber); }
  .otag.awaiting { color: var(--text); }
  .otag.paid { color: var(--green); }
  .otag.mute { color: var(--text-3); }

  /* A batch the day's legs belong to is a pointer out of the day, not a row of
     the day: it states what the whole batch is worth and hands the operator to
     it. The text is single-line so a long span cannot widen the sheet. */
  .blinks { padding-top: 6px; }
  .blink {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 48px;
    background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 12px 2px; text-align: left; cursor: pointer;
    font-family: inherit; color: var(--text-2);
  }
  .blink:active { background: var(--surface-press); }
  .blink-t {
    flex: 1; min-width: 0; font-size: 13px; font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .blink-c { flex-shrink: 0; font-size: 17px; color: var(--text-3); }

  /* ---- order sheet ----
     The leg read as itself, so most values are the platform's own free text
     rather than a figure: the label keeps its width and the value takes the
     wrapping, or one long address widens the whole sheet. */
  .order-rows .k { flex-shrink: 0; padding-right: 12px; }
  .order-rows .v { min-width: 0; text-align: right; overflow-wrap: anywhere; }
  /* A fine is money going out of what the leg earns. */
  .order-rows .v.fine { color: var(--red); }
  .oarrow { color: var(--text-3); }
  /* The order is fetched per open, so a fetch that did not land leaves the
     sheet with the reason rather than an empty body. */
  .order-err { font-size: 14px; color: var(--amber); padding: 8px 2px 2px; }

  /* ---- credit and queue sheets ---- */
  /* A note qualifies the summary row above it rather than stating a figure of
     its own, so it hangs off that row instead of starting a new one. */
  .sub-note { font-size: 12px; padding: 0 2px 8px; margin-top: -4px; }
  .sub-note.warn { color: var(--amber); }
  .sub-note.mute { color: var(--text-3); }
  /* The queue is a work list rather than a record: every row is a credit still
     to be accounted for and the way into it, so the whole row is the control. */
  .qrow {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 46px;
    background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 11px 2px; text-align: left; cursor: pointer; font-family: inherit;
    color: var(--text); font-size: 14px; font-variant-numeric: tabular-nums;
  }
  .qrow:active { background: var(--surface-press); }
  .qrow .t { flex: 1; min-width: 0; }
  .qrow .s { color: var(--blue); font-weight: 650; font-size: 13px; }
  .qrow .c { color: var(--text-3); font-size: 17px; }
  /* The count of unmatched credits in the header is the way into the queue, so
     it has to look like one without turning the summary line into a row of
     controls. */
  .sum-link {
    background: none; border: none; padding: 0; font: inherit; color: var(--blue);
    cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }

  /* ---- proposals ----
     What the matcher believes could pay what is owed, in either direction. A
     row states the other side and carries the one tap that would take it; the
     belief leads without acting on itself, the way the chat card's buttons do. */
  .prop-sec { padding: 12px 2px 0; }
  .prop-head { font-size: 13px; font-weight: 650; color: var(--text-2); padding-bottom: 6px; }
  .prow {
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--line); padding: 10px 2px;
    font-size: 14px; font-variant-numeric: tabular-nums;
  }
  .prow .t { flex: 1; min-width: 0; }
  .ptag {
    flex-shrink: 0; font-size: 11px; font-weight: 650; padding: 2px 6px; border-radius: 5px;
    background: var(--paid-bg); color: var(--green);
  }
  .pbtn {
    flex-shrink: 0; background: var(--key-bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; font-family: inherit; font-size: 13px;
    font-weight: 650; color: var(--text); cursor: pointer;
  }
  .pbtn:active { background: var(--key-press); }
  /* A queue row whose match is unambiguous answers itself, so the answer and
     the tap that takes it hang under the row rather than inside its control. */
  .qitem { border-bottom: 1px solid var(--line); }
  .qitem .qrow { border-bottom: none; }
  .qprop {
    display: flex; align-items: center; gap: 8px; padding: 0 2px 10px;
    font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .qprop .t { flex: 1; min-width: 0; color: var(--text-2); }

  /* ---- unpaid tick section ---- */
  .up-sec { padding: 12px 2px 0; }
  .up-head { font-size: 13px; font-weight: 650; color: var(--text-2); padding-bottom: 6px; }
  .up-note { font-size: 12px; color: var(--text-3); padding: 0 2px 6px; }
  .up-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-bottom: 8px; }
  .up-chips .up-note { padding-bottom: 0; }
  .up-chip {
    background: var(--key-bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 10px; font-family: inherit; font-size: 12px; color: var(--text-2);
    cursor: pointer;
  }
  .up-chip:active { background: var(--key-press); }
  .up-chk { flex-shrink: 0; font-size: 16px; line-height: 1; width: 18px; color: var(--text-2); }
  .up-chk.on { color: var(--text); }
  .up-foot {
    display: flex; align-items: center; gap: 10px; padding: 10px 2px 0;
    font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .up-foot .up-sum { flex: 1; color: var(--text-2); }
  .up-foot .up-sum.warn { color: var(--amber); }
  .up-btn {
    flex-shrink: 0; background: var(--key-bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; font-family: inherit; font-size: 13px;
    font-weight: 650; color: var(--text); cursor: pointer;
  }
  .up-btn:disabled { opacity: .35; cursor: default; }
  .up-btn:not(:disabled):active { background: var(--key-press); }

  .undo-info { padding: 12px 2px 6px; font-size: 14px; line-height: 1.7; color: var(--text-2); }

  /* ---- statement sheet ----
     The report is the text the bot's card carries, printed as it came rather
     than rebuilt as rows: one text source means the chat and the page cannot
     drift apart about what a statement says. */
  .stmt-report {
    white-space: pre-wrap; overflow-wrap: anywhere;
    font-family: inherit; font-size: 13px; line-height: 1.55;
    font-variant-numeric: tabular-nums;
    background: var(--surface); border-radius: 10px;
    padding: 12px; margin-top: 8px;
  }
  .stmt-credit { font-size: 14px; color: var(--text-2); padding: 10px 2px 0; }
  .stmt-note { font-size: 13px; color: var(--text-3); padding: 6px 2px 0; }
  .stmt-err { font-size: 14px; color: var(--amber); padding: 8px 2px 2px; }
  /* Reading is ~2 s of OCR on top of the upload, so the control says it is
     working rather than looking like a tap that missed. */
  .icon-btn:disabled { opacity: .5; cursor: default; }

  /* The drop target is the whole page: on a desktop the file is dragged out of
     the platform's own download, which is the original the reader wants. */
  .drop {
    position: fixed; inset: 0; z-index: 40; display: none;
    background: var(--scrim); color: var(--text);
    align-items: center; justify-content: center;
    font-size: 17px; font-weight: 650;
  }
  .drop.show { display: flex; }
  .drop span {
    border: 2px dashed var(--text-2); border-radius: 14px;
    padding: 24px 28px; background: var(--sheet-bg);
  }

  /* Five controls share the header row here. Below iPhone SE width the month
     label wraps onto a second line and collides with the summary under it, so
     the round buttons give up the width instead. */
  @media (max-width: 360px) {
    .nav-btn, .icon-btn { width: 34px; }
  }

  /* ---- desktop ----
     The dashboard is phone-only. A wide screen has nothing else to show --
     every batch is read from the day it sits on -- so the width buys bigger
     cells rather than a second column. Sheets are unchanged: they stay
     phone-width bottom sheets. */
  @media (min-width: 900px) {
    body { max-width: 640px; }
    .cell { min-height: 76px; padding: 18px 5px 8px; }
    .cell .d { font-size: 12px; line-height: 14px; }
    .cell .amt { font-size: 15px; }
    .bar, .cchip { height: 22px; font-size: 13px; }
    .lane { grid-auto-rows: 22px; }
  }
</style>
</head>
<body>
<div class="header">
  <div class="header-row">
    <button class="nav-btn" id="prevM" aria-label="前一個月">&larr;</button>
    <button class="date-btn" id="monthBtn"></button>
    <button class="nav-btn" id="nextM" aria-label="後一個月">&rarr;</button>
    <button class="icon-btn" id="stmtBtn" aria-label="讀結算圖">圖</button>
    <a class="icon-btn" href="/" aria-label="返日程">&#10005;</a>
  </div>
  <div class="summary" id="summary"></div>
  <div class="chips" id="chips"></div>
  <div class="wk"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
</div>
<div class="cal">
  <!-- The colour key is read once and sits above the strip: the strip has no
       end to put it after, since scrolling to either end loads another month. -->
  <div class="legend">琥珀 = 平台欠緊（未結算 · 差數）· 藍 = 入數未對 · 琥珀框 = 入數已對但批次仍差 · 灰條 = 等過數 · 綠 = 已收 · 淡 = 已對／收埋 · 虛線 = 補結</div>
  <div class="sent" id="sentTop"></div>
  <div class="weeks" id="grid"></div>
  <div class="sent" id="sentBot"></div>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="drop" id="drop"><span>放低張結算圖</span></div>
<input type="file" id="stmtFile" accept="image/*" hidden>

<script>
'use strict';
{% include "_shared.js" %}

// ---- state ----
// /api/settle answers one month at a time, but the calendar is a continuous
// strip, so the page holds every month it has scrolled through: 'YYYY-MM' ->
// that month's payload. The keys are always an unbroken run, because a gap
// would draw as real dates carrying no data -- indistinguishable from days
// with no work on them.
let months = new Map();
// Months with a fetch in flight. A sentinel can enter the viewport twice
// before its month lands, and the second entry must not fetch again.
let loading = new Set();
// Bumped whenever the strip is thrown away and refounded (platform switch, a
// jump far outside it). A fetch that started before the bump is answering a
// question nobody is asking any more.
let gen = 0;
// The merged read of every loaded month, which is what the whole page below
// works off.
let data = { orders: [], settlements: [], counts: {}, totals: { unsettled: 0, awaiting: 0 }, now: '' };
// The bank ledger, exactly what /api/credits returns: every credit of the
// platform, whatever the strip has loaded.
let ledger = { counts: { open: 0, partial: 0, done: 0, archived: 0 }, sums: { open: 0, done: 0 }, credits: [] };
let curPlat = 'ride';
// The month the header names: the one the strip is showing, updated by the
// scroll rather than by a paging button.
let viewMonth = fmtDate(new Date()).slice(0, 7);
// Settle-ability is decided against the server's clock, not the browser's, so
// the page and the API agree on which legs are done.
let NOW = '';
let TODAY = '';
let BATCH_OF = new Map();
// Which batches have their order list unfolded. Page state rather than DOM
// state, so an SSE repaint mid-read does not fold the list away.
let foldOpen = new Set();
// Which money relation the strip is lighting: null, or { kind, id } naming a
// batch or a credit. Page state rather than DOM state, because the relation
// outlives the paint that drew it -- a month arriving under the scroll, or an
// SSE repaint, must not drop what the operator is reading.
let focus = null;

// The operator works one platform for a stretch, so reopening lands where he
// left off. Storage can be unavailable (private mode), and the page must
// still render if it is.
function loadPlat() {
  try {
    const p = localStorage.getItem('settlePlatform');
    if (p && PLATFORMS.some(x => x.key === p)) curPlat = p;
  } catch (e) { /* no stored preference */ }
}
function savePlat() {
  try { localStorage.setItem('settlePlatform', curPlat); } catch (e) { /* not stored */ }
}

// ---- derived state ----
// expectedOf() is the twin of service.py:expected_of and lives in _shared.js,
// because the dashboard's detail sheet reads it too.
function orderDate(o) { return (o.scheduled_time || '').split(' ')[0]; }
function batchById(id) { return data.settlements.find(b => b.id === +id) || null; }
function creditById(id) { return ledger.credits.find(c => c.id === +id) || null; }
// The work queue: the credits no statement accounts for yet. Oldest value date
// first, the order list_credits returns -- those are the ones being chased.
function openCredits() { return ledger.credits.filter(c => c.state === 'open' || c.state === 'partial'); }
function batchOf(orderId) { return BATCH_OF.get(orderId) || null; }
function reindex() {
  // A batch can straddle months, so its own member list is the only place legs
  // outside the loaded months appear.
  BATCH_OF = new Map();
  for (const b of data.settlements) {
    for (const o of b.orders) BATCH_OF.set(o.order_id, b);
  }
}
// Mirrors db.py's settleable predicate: finished, priced, not already batched.
// Both other kinds of leg stay visible; neither can enter a batch.
function isSettleable(o) {
  return !batchOf(o.order_id) && (o.price || 0) > 0 && o.scheduled_time < NOW;
}
function ordersOn(dateStr) {
  return data.orders.filter(o => orderDate(o) === dateStr);
}
// Two numbers per day: what it earned, and how much of that no statement has
// claimed. Amber is the second one; a day fully on statements shows its total
// muted, because the bar under it carries the state.
function dayInfo(dateStr) {
  const list = ordersOn(dateStr);
  let total = 0, loose = 0;
  for (const o of list) {
    const amt = expectedOf(o);
    total += amt;
    if (!batchOf(o.order_id)) loose += amt;
  }
  return { n: list.length, total, loose };
}

// ---- labels ----
function pad2(n) { return String(n).padStart(2, '0'); }
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return fmtDate(d);
}
// 0 = Sunday, the column the week strip starts on.
function dow(dateStr) { return new Date(dateStr + 'T00:00:00').getDay(); }
function monthKey(dateStr) { return dateStr.slice(0, 7); }
function addMonths(key, n) {
  const y = +key.slice(0, 4), m = +key.slice(5, 7) - 1 + n;
  return (y + Math.floor(m / 12)) + '-' + pad2((m % 12 + 12) % 12 + 1);
}
// Day 0 of the next month is the last day of this one, whatever its length.
function monthEnd(key) {
  return key + '-' + pad2(new Date(+key.slice(0, 4), +key.slice(5, 7), 0).getDate());
}
function monthsBetween(a, b) {
  const out = [];
  for (let k = a; k <= b; k = addMonths(k, 1)) out.push(k);
  return out;
}
function todayMonth() { return TODAY ? monthKey(TODAY) : fmtDate(new Date()).slice(0, 7); }
function mdLabel(dateStr) {
  const p = dateStr.split('-');
  return (+p[1]) + '月' + (+p[2]) + '日';
}
function mdSlash(dateStr) { return (+dateStr.slice(5, 7)) + '/' + (+dateStr.slice(8, 10)); }
function platLabel(key) { return PLATFORMS.find(p => p.key === key).label; }
function paidLabel(b) { return '已收 ' + mdSlash(b.paid_on); }
// Money to the cent, so the label carries both figures rather than the one the
// column has room for: what the statement is worth, and what is still owed.
function barLabel(b) {
  return b.state === 'partial'
    ? '$' + $(b.confirmed_amount) + ' · 差 $' + $(b.outstanding)
    : '$' + $(b.confirmed_amount);
}
function round2(n) { return Math.round(n * 100) / 100; }
// The last four characters, the way the platform's own message names a leg.
function tailId(id) { return '…' + String(id).slice(-4); }
// What a batch is owed, in one phrase: a part-paid batch is neither 已收 nor
// simply 等過數 -- the outstanding half is what the operator is chasing.
function batchTag(b) {
  if (b.state === 'paid') return paidLabel(b);
  if (b.state === 'partial') return '差 $' + $(b.outstanding);
  return '等過數';
}
// A batch is the account and a credit is one of its lines, so a chip's colour
// is read off the batches it went into, not off how much of itself is left:
// money already put against a batch that is still short is still open work.
function chipState(c) {
  if (c.state === 'archived') return ' gone';
  // Money still unmatched is what the queue chases, so it keeps the queue's
  // colour whatever else the credit has already paid; only a fully spent
  // credit takes its colour from the batches it went to.
  if (c.state === 'open' || c.state === 'partial') return ' open';
  if ((c.batches || []).some(b => b.state === 'partial')) return ' short';
  return '';
}
// Display-only shortening; the raw string stays on the order.
function shortPlace(s) {
  const t = String(s || '').replace(/[(（][^)）]*[)）]\s*$/, '').trim();
  if (/机场|機場/.test(t)) {
    const m = t.match(/T[12]/i);
    return '機場' + (m ? ' ' + m[0].toUpperCase() : '');
  }
  return t;
}
// Batches are normally whole consecutive days, so a range reads best; a
// deliberately non-contiguous batch is listed out instead of being flattened
// into a range that would claim days it does not hold.
function dateSpanLabel(dates) {
  const s = [...dates].sort();
  if (!s.length) return '';
  if (s.length === 1) return mdLabel(s[0]);
  const contiguous = s.every((d, i) => i === 0 || d === addDays(s[i - 1], 1));
  const a = s[0], z = s[s.length - 1];
  if (contiguous) {
    if (a.slice(0, 7) === z.slice(0, 7)) return (+a.slice(5, 7)) + '月' + (+a.slice(8)) + '–' + (+z.slice(8)) + '日';
    return mdLabel(a) + '–' + mdLabel(z);
  }
  if (s.length <= 3 && s.every(d => d.slice(0, 7) === a.slice(0, 7))) {
    return (+a.slice(5, 7)) + '月' + s.map(d => +d.slice(8)).join('、') + '日';
  }
  return mdLabel(a) + '–' + mdLabel(z);
}
// What the operator needs to recognise the leg on a platform statement: the
// service, plus the endpoint he actually drove to (or the flight he met).
function orderLabel(o) {
  if (platform(o) !== 'ride') return svcLabel(o.service_type);
  const svc = svcLabel(o.service_type);
  const who = o.flight_number || shortPlace(o.service_type === '送机' ? o.pickup : o.dropoff) || o.passenger_name;
  return who ? svc + ' · ' + who : svc;
}
// A 16- or 19-digit number is read off a statement in chunks, so the digits
// are grouped for the eye. Presentation only: data-copy and the clipboard
// carry the raw id. A number carrying letters is a code rather than a run of
// digits to be chunked, and a short one needs no help, so both stay as they
// are.
function groupId(id) {
  const s = String(id);
  return /^\d{9,}$/.test(s) ? s.replace(/(\d{4})(?=\d)/g, '$1\u2009') : s;
}
function batchDates(b) {
  return [...new Set(b.orders.map(orderDate))].sort();
}
// A batch's dates are not assumed contiguous: the platform holds a problem leg
// back and settles it with a later statement. The latest run is the statement's
// own days; every earlier run is a leg it picked up.
function runsOf(dates) {
  const runs = [];
  for (const d of [...dates].sort()) {
    const last = runs[runs.length - 1];
    if (last && d === addDays(last[last.length - 1], 1)) last.push(d);
    else runs.push([d]);
  }
  return runs;
}
function primaryRunOf(dates) { const r = runsOf(dates); return r[r.length - 1] || []; }
function spanLabelOf(dates) { return dateSpanLabel(primaryRunOf(dates)); }
function batchLabel(b) { return spanLabelOf(batchDates(b)); }
function runShortLabel(run) {
  const a = run[0], z = run[run.length - 1];
  if (a.slice(0, 7) !== z.slice(0, 7)) return dateSpanLabel(run);
  return (+a.slice(8)) + (a === z ? '' : '–' + (+z.slice(8))) + '日';
}
function heldLabel(b) {
  const runs = runsOf(batchDates(b)).slice(0, -1);
  if (!runs.length) return '';
  return '連 ' + runs.map(run =>
    runShortLabel(run) + ' ' + b.orders.filter(o => run.includes(orderDate(o))).length + ' 程').join(' · ');
}

// ---- load ----
function loadedMonths() { return [...months.keys()].sort(); }

// Every reader below asks the merged book, not a month, so the merge is where
// the strip stops being a pile of month payloads.
function remerge(book) {
  const orders = [];
  const settlements = [];
  const seen = new Set();
  for (const key of loadedMonths()) {
    const p = months.get(key);
    for (const o of p.orders) orders.push(o);
    // Orders are scoped to their month server-side, but a batch straddling a
    // boundary comes back whole in both months' payloads, so it has to be
    // taken once or its bar would be drawn twice.
    for (const b of p.settlements) {
      if (seen.has(b.id)) continue;
      seen.add(b.id);
      settlements.push(b);
    }
  }
  // counts, totals and the clock span all time, so any payload carries them and
  // the freshest one wins.
  data = { orders, settlements, counts: book.counts, totals: book.totals, now: book.now };
  NOW = data.now;
  TODAY = NOW.slice(0, 10);
  reindex();
}

// One month into the map, nothing drawn: a caller loading several fills them
// all in and paints once.
async function fetchMonth(key) {
  if (months.has(key) || loading.has(key)) return;
  // Refounding swaps the set rather than emptying it, so the entry has to come
  // out of the one it went into and not out of whatever is current by then.
  const inflight = loading;
  const g = gen;
  inflight.add(key);
  let payload;
  try {
    const res = await fetch('/api/settle?month=' + key + '&platform=' + curPlat);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    payload = await res.json();
  } catch (e) {
    toast('載入失敗');
    return;
  } finally {
    inflight.delete(key);
  }
  if (g !== gen) return;
  months.set(key, payload);
}

// The strip fills in every month between what it holds and the one asked for,
// because its keys have to stay an unbroken run. A month far outside it is a
// jump rather than a scroll, so past this many the strip is refounded there
// instead of paying for every month in between.
const FILL_MAX = 3;
async function ensureMonth(key) {
  if (months.has(key)) return true;
  const keys = loadedMonths();
  const lo = keys.length && keys[0] < key ? keys[0] : key;
  const hi = keys.length && keys[keys.length - 1] > key ? keys[keys.length - 1] : key;
  const want = monthsBetween(lo, hi).filter(k => !months.has(k) && !loading.has(k));
  if (want.length > FILL_MAX) return refound(key);
  await Promise.all(want.map(fetchMonth));
  if (!months.has(key)) return false;
  remerge(months.get(key));
  render();
  return true;
}

// Throw the strip away and start it again on one month: the platform changed,
// or the operator asked for somewhere the strip cannot reach by scrolling.
// The old rows go first, so the paint has nothing to hold position against and
// the new strip -- which begins on that month's first week -- comes up at the
// top of the strip area on its own.
async function refound(key) {
  gen++;
  months = new Map();
  loading = new Set();
  anchorDebt = 0;
  pinId = '';
  document.getElementById('grid').innerHTML = '';
  window.scrollTo(0, 0);
  await load(key);
  return months.has(key);
}

// A write here or on another device lands through load(): every month the strip
// holds is refetched at once, because a batch or a credit can have moved in any
// of them, and a half-refreshed strip would show the same batch in two states.
async function load(seed) {
  const keys = loadedMonths();
  if (!keys.length) keys.push(seed || todayMonth());
  const g = gen;
  let payloads, credits;
  try {
    // The ledger comes with the months: the header counts it and the sheet
    // lists it, and a credit landing has to reach both at once.
    const res = await Promise.all(
      keys.map(k => fetch('/api/settle?month=' + k + '&platform=' + curPlat))
        .concat([fetch('/api/credits?platform=' + curPlat)]));
    const bad = res.find(r => !r.ok);
    if (bad) throw new Error('HTTP ' + bad.status);
    const bodies = await Promise.all(res.map(r => r.json()));
    credits = bodies.pop();
    payloads = bodies;
  } catch (e) {
    toast('載入失敗');
    return;
  }
  if (g !== gen) return;
  keys.forEach((k, i) => months.set(k, payloads[i]));
  ledger = credits;
  remerge(payloads[payloads.length - 1]);
  dropStaleFocus();
  render();
  repaintOpenView();
}

// A write here or on another device lands through load(): an open sheet has to
// show the new state, and a batch that no longer exists cannot be shown at all.
function repaintOpenView() {
  if (!views.length) return;
  views = views.filter(v => {
    if (v.kind === 'credit') return !!creditById(v.id);
    if (v.kind !== 'batch' && v.kind !== 'undo' && v.kind !== 'unlink') return true;
    const b = batchById(v.id);
    if (!b) return false;
    // A confirm view for money already off the batch has nothing left to
    // confirm: another device, or the bot, can have taken it back first.
    return v.kind !== 'unlink' || b.allocations.some(a => a.credit_id === v.credit);
  });
  if (!views.length) { closeSheet(); return; }
  paintView();
}

// ---- render ----
// The calendar goes first: the header names the month the strip is showing, and
// that is read off the rows the calendar has just laid out.
function render() {
  renderChips();
  renderCalendar();
  renderHeader();
}

function renderHeader() {
  const y = +viewMonth.slice(0, 4), m = +viewMonth.slice(5, 7);
  document.getElementById('monthBtn').innerHTML =
    y + ' 年 ' + m + ' 月' + (viewMonth === todayMonth() ? '<small>今個月</small>' : '<small>&nbsp;</small>');
  // Totals span the whole book, not the months the strip has loaded: old
  // unsettled days are exactly the ones the operator is here to clear. The
  // server computes them, so the chips and the calendar cannot disagree about
  // the same money.
  // Only what is still to be done: a matched or archived credit is finished
  // business and is read off the calendar by its value date instead.
  const open = openCredits();
  document.getElementById('summary').innerHTML =
    '未結算 <span class="warn">' + money(data.totals.unsettled) + '</span> · 等過數 $' + $(data.totals.awaiting) +
    (open.length ? ' · <button class="sum-link" data-credits="1">入數未對 ' + open.length +
      ' 筆 $' + $(ledger.sums.open) + '</button>' : '');
}

function renderChips() {
  document.getElementById('chips').innerHTML = PLATFORMS.map(p => {
    const n = data.counts[p.key] || 0;
    const on = curPlat === p.key;
    return '<button class="chip' + (on ? ' on' : (n ? '' : ' zero')) + '" data-f="' + p.key + '">' +
      esc(p.label) + ' ' + n + '</button>';
  }).join('');
}

function cellHtml(dateStr) {
  const day = +dateStr.slice(8);
  // The 1st carries its month, because a week row is not a month and there is
  // no heading above it to read the month off.
  const num = day === 1 ? mdSlash(dateStr) : String(day);
  const info = dayInfo(dateStr);
  const today = dateStr === TODAY ? ' today' : '';
  // Only an empty day is inert; every day holding work opens, past or future.
  if (!info.n) return '<button class="cell none' + today + '" disabled><span class="d">' + num + '</span></button>';
  const future = dateStr > TODAY;
  const cls = future ? 'future' : (info.loose > 0 ? 'unsettled' : 'done');
  const amt = future ? info.total : (info.loose > 0 ? info.loose : info.total);
  return '<button class="cell' + today + '" data-d="' + dateStr + '">' +
    '<span class="d">' + num + '</span><span class="amt ' + cls + '">' + money(amt) + '</span></button>';
}

// Every week of the loaded run, end to end, with no month break in it: from the
// Sunday of the week holding the 1st of the earliest month to the Saturday of
// the week holding the last day of the latest. Every cell is a real date, so a
// week row can span two months and a bar across the boundary stays one bar. The
// edge weeks reach into months not loaded yet; those days draw as empty and
// fill in when their month arrives.
function stripWeeks() {
  const keys = loadedMonths();
  if (!keys.length) return [];
  const last = monthEnd(keys[keys.length - 1]);
  const end = addDays(last, 6 - dow(last));
  const weeks = [];
  const first = keys[0] + '-01';
  for (let s = addDays(first, -dow(first)); s <= end; s = addDays(s, 7)) {
    const w = [];
    for (let i = 0; i < 7; i++) w.push(addDays(s, i));
    weeks.push(w);
  }
  return weeks;
}

// Which month a week row belongs to, for the header label and for the scroll
// targets. The week holding the 1st is the first row of the new month: it is
// the row the operator scrolls to for that month, and everything under it is
// that month, whichever side of the boundary most of its own seven days sit.
function weekMonth(week) { return monthKey(week[6]); }
// A week row is addressed by the Sunday it starts on, both ways round: the
// scroll code has to find a row again across a repaint that rebuilt every one
// of them, and has to read a row's dates back off the row it found.
function weekId(sunday) { return 'wk' + sunday; }
function idWeek(id) { return id.slice(2); }
// The row a given day is drawn on.
function weekIdOf(dateStr) { return weekId(addDays(dateStr, -dow(dateStr))); }
// The Sunday of the week holding the 1st, which is that month's first row.
function monthWeekId(key) { return weekIdOf(key + '-01'); }

// Each run of a batch is laid out on its own and cut again at the week
// boundary, so a segment is the unit both the grid and the lane packer see.
// Batches come before credits so a bar is never pushed under a chip.
function weekEvents(week) {
  const idx = new Map();
  week.forEach((d, i) => idx.set(d, i));
  const out = [];
  for (const b of data.settlements) {
    const runs = runsOf(batchDates(b));
    const point = runs[runs.length - 1][0];
    runs.forEach((run, ri) => {
      const at = run.filter(d => idx.has(d)).map(d => idx.get(d));
      if (!at.length) return;
      const start = Math.min(...at), end = Math.max(...at);
      const makeup = ri < runs.length - 1;
      // The label rides the run's first segment only, so a wrapped bar is
      // not read as two batches of the same amount.
      const head = idx.get(run[0]) === start;
      out.push({
        type: 'bar', start, cols: end - start + 1, batch: b,
        makeup, point, from: run[0], head,
        label: !head ? '' : makeup ? makeupLabel(point, run[0]) : barLabel(b),
        // Squared off whenever the run carries on past this segment, so the
        // pieces read as one bar wrapping. The strip is continuous, so the only
        // thing that cuts a bar is the week wrap -- a batch straddling a month
        // boundary is drawn whole.
        cutR: run[run.length - 1] > week[end],
        cutL: run[0] < week[start],
      });
    });
  }
  for (const c of ledger.credits) {
    if (!idx.has(c.value_date)) continue;
    out.push({ type: 'chip', start: idx.get(c.value_date), cols: 1, credit: c,
               label: '入$' + $(c.amount) });
  }
  return out;
}

// ---- label geometry ----
// A calendar label is a reconciliation figure, so it is never shortened to fit
// the column: the layout yields to the number instead. Every event therefore
// carries a reach -- the columns its label needs, never fewer than the columns
// its days occupy -- and that has to be measured rather than guessed. The
// desktop rule changes both the font size and the column width, so the metrics

function textWidth(font, s) {

}
function calMetrics(grid) {

    grid.removeChild(probe);

  // 4px gaps between them. A hidden page measures zero, and zero would reserve

  // once between each pair of characters.

    e.reach = e.label ? reachOf(e, m) : e.cols;

      e.rs >= x.rs + x.reach || e.rs + e.reach <= x.rs));

// A 補結 segment carries no amount: it points at the run that does.
function makeupLabel(point, from) {

}

function eventHtml(e, lane) {
  // Both axes are explicit: grid auto-placement is sparse and never moves
  // backwards, so an item whose column precedes its predecessor's would be
  // pushed to a new row and the lane would silently stop being one row.
  const place = 'grid-column:' + (e.rs + 1) + '/span ' + e.reach + ';grid-row:' + (lane + 1);
  if (e.type === 'bar') {
    const b = e.batch;
    const cls = ['bar', b.state];
    if (e.makeup) cls.push('makeup');
    if (e.cutR) cls.push('cut-r');
    if (e.cutL) cls.push('cut-l');
    if (e.spillL) cls.push('spill-l');
    // Repeating the lane's track inside the reservation puts the fill's edges
    // on the same column edges the cells above use.
    const at = e.spillL ? e.reach - e.cols + 1 : 1;
    // A part-paid batch draws what has arrived against what is owed: the paid
    // fraction on the left in the paid colour, the rest in the owed one. Not on
    // a 補結 segment, which carries no fill at all.
    let fill = '';
    if (b.state === 'partial' && !e.makeup && b.confirmed_amount > 0) {
      const pct = Math.max(0, Math.min(100, (b.received / b.confirmed_amount) * 100)).toFixed(2);
      fill = ';background:linear-gradient(90deg,var(--paid-bg) 0 ' + pct + '%,var(--banner-bg) ' +
        pct + '% 100%)';

    return '<span class="slot" style="' + place +
      ';grid-template-columns:repeat(' + e.reach + ',minmax(0,1fr))">' +
      '<button class="' + cls.join(' ') + '" style="grid-column:' + at + '/span ' + e.cols + fill +
      '" data-bar="' + b.id + '">' + e.label + '</button></span>';
  }
  const c = e.credit;
  const cls = 'cchip' + chipState(c) + (e.spillL ? ' spill-l' : '');
  return '<button class="' + cls + '" style="' + place + '" data-chip="' + c.id + '">' +
    e.label + '</button>';
}

function renderCalendar() {
  const grid = document.getElementById('grid');
  const m = calMetrics(grid);
  const weeks = stripWeeks();
  const html = weeks.map((week, wi) => {
    const events = weekEvents(week);
    reserve(events, m);
    const lanes = packLanes(events);
    const start = wi > 0 && weekMonth(week) !== weekMonth(weeks[wi - 1]);
    return '<div class="wkblock' + (start ? ' mstart' : '') + '" id="' + weekId(week[0]) +
      '"><div class="grid">' + week.map(cellHtml).join('') + '</div>' +
      (lanes.length ? '<div class="lane">' +
        lanes.map((lane, li) => lane.map(e => eventHtml(e, li)).join('')).join('') + '</div>' : '') +
      '</div>';
  }).join('');
  const anchor = takeAnchor();
  grid.innerHTML = html;
  putAnchor(anchor);
  const mon = monthAtTop();
  if (mon) viewMonth = mon;
  // A month arriving under the scroll draws bars and days of a relation the
  // operator is already reading, so the paint ends by restating it.
  paintFocus();
  pokeEdges();
}

// ---- scrolling the strip ----
// Everything above the strip is sticky, so the top row of the strip sits flush
// against the bottom of the header. Flush rather than spaced: a gap would show
// the tail of the week above through it, and the header carries its own bottom
// padding as breathing room. This is one line, and the scroll target, the
// anchor and the header label all have to read it as the same line -- give any
// of them its own offset and a month scrolled to the top leaves the sliver of
// the week above it naming the header.
function stripTop() {
  return document.querySelector('.header').getBoundingClientRect().bottom;
}
function topRow() {
  // The row above the top one ends exactly on that line, and subpixel layout
  // drops its end a fraction either side, so the test carries a pixel of slack
  // or the row above would win.
  const edge = stripTop() + 1;
  for (const el of document.querySelectorAll('#grid .wkblock')) {
    if (el.getBoundingClientRect().bottom > edge) return el;
  }
  return null;
}
function monthAtTop() {
  const el = topRow();

}
// Put a week row at the top of the strip.
function scrollToWeek(id, smooth) {
  const el = document.getElementById(id);
  if (!el) return;
  const y = window.scrollY + el.getBoundingClientRect().top - stripTop();
  window.scrollTo({ top: Math.max(0, y), behavior: smooth ? 'smooth' : 'auto' });
}
// Put a month's first week row at the top of the strip.
function scrollToMonth(key, smooth) { scrollToWeek(monthWeekId(key), smooth); }

// A repaint rebuilds every week row, and rows above the viewport change height
// whenever a month is prepended or a lane appears -- which would slide the
// strip out from under the operator. The fix is an anchor: where the top row
// sat before the paint, put it back after.
//
// A strip only a month or two long is barely taller than the screen, so the
// scroll that would hold it still runs out of document. What could not be
// scrolled is owed to the next paint, by which time the strip has grown. A
// pinned row states the same target every paint and simply asks again; an
// ordinary one has no target to restate, so it carries the shortfall.

function takeAnchor() {
  const edge = stripTop();

  // because what is on screen is where the unfinished scroll left it.
  if (pinId && document.getElementById(pinId)) return { id: pinId, off: edge, pin: true };
  const el = topRow();
  if (!el) return null;
  const top = el.getBoundingClientRect().top;
  // A top row sitting below the strip's top line has page chrome above it --
  // the colour key at the head of the page, which only the untouched strip is
  // ever short enough to show. Growth at the top displaces that chrome, so
  // such a row is pinned to the line. Anywhere else the row is where the
  // operator scrolled it to, and goes back exactly there.
  if (top <= edge) return { id: el.id, off: top, pin: false };
  pinId = el.id;

  const from = window.scrollY;
  if (want) window.scrollBy(0, want);
  const left = want - (window.scrollY - from);

// The strip grows by being scrolled rather than by a button, so its two ends

// reached, and one entry loads one month.
let edgeIO = null;

  edgeIO = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const keys = loadedMonths();
      if (!keys.length) continue;
      ensureMonth(e.target.id === 'sentTop'
        ? addMonths(keys[0], -1) : addMonths(keys[keys.length - 1], 1));
    }

// terminates the growth: a month prepended pushes the top sentinel out of
// range, and until it is out of range the strip is still too short.
function pokeEdges() {
  if (!edgeIO) return;
  edgeIO.disconnect();

  edgeIO.observe(document.getElementById('sentBot'));

// ---- focus ----
// A credit chip sits on the day the bank paid, the batch it paid for sits on
// the days that were driven, and nothing on the strip says the two are the same
// money. Focus is that statement: one end is named, and everything not part of
// the relation recedes.
//
// The relation is read off the ledger rather than off the loaded months,
// because that is the only place an end outside them appears: a credit carries
// every batch it went into, and each of those carries its own days.
//
// It is the whole connected run of allocations, not one hop out from the end
// named. Two credits paying one batch are one money statement, and a statement
// has to read the same from every end of it -- entering at either chip or at
// the bar must light the identical set, or the operator is being told the sum
// depends on where he looked. Closing over the edges buys that invariance at
// the cost of a long chain lighting entirely, which is what a chain of money
// crossing over itself is.

// A batch's days wherever the page holds them: the ledger carries them for
// every batch some credit paid, whatever the strip has loaded; the book carries
// them for a batch no credit has been put against yet.
function batchDatesOf(id) {
  for (const c of ledger.credits) {
    for (const b of c.batches) if (b.id === id) return b.dates;
  }
  const own = batchById(id);
  return own ? batchDates(own) : [];
}

function focusSets() {
  const s = { batches: new Set(), credits: new Set(), dates: new Set() };
  if (!focus) return s;
  // Every allocation in both directions, so the walk crosses the graph the same
  // way from either side of an edge.
  const edges = { batch: new Map(), credit: new Map() };
  const link = (m, from, to) => { if (!m.has(from)) m.set(from, []); m.get(from).push(to); };
  for (const c of ledger.credits) {
    for (const b of c.batches) { link(edges.credit, c.id, b.id); link(edges.batch, b.id, c.id); }
  }
  const seen = { batch: s.batches, credit: s.credits };
  const walk = [focus];
  seen[focus.kind].add(focus.id);
  for (let i = 0; i < walk.length; i++) {
    const n = walk[i];
    if (n.kind === 'batch') for (const d of batchDatesOf(n.id)) s.dates.add(d);
    const other = n.kind === 'batch' ? 'credit' : 'batch';
    for (const id of edges[n.kind].get(n.id) || []) {
      if (seen[other].has(id)) continue;
      seen[other].add(id);
      walk.push({ kind: other, id });
    }
  }
  return s;
}

// Lit and dim are set on what the paint has already laid out rather than woven
// into the markup: a focus is taken and dropped by a pointer moving across the
// strip, and rebuilding every week row for that would fight the scroll anchor.
// One place decides, so a month painted later and a hover both read the same.
function paintFocus() {
  const s = focus ? focusSets() : null;
  const grid = document.getElementById('grid');
  // The two ends of the same statement, so they are set together: with no
  // focus down neither is set and the strip is back to its own strengths.
  const mark = (el, held) => {
    el.classList.toggle('lit', !!s && held);
    el.classList.toggle('dim', !!s && !held);
  };
  grid.querySelectorAll('[data-bar]').forEach(el =>
    mark(el, s && s.batches.has(+el.dataset.bar)));
  grid.querySelectorAll('[data-chip]').forEach(el =>
    mark(el, s && s.credits.has(+el.dataset.chip)));
  // An empty day already reads as a calendar coordinate rather than money, so
  // it is left alone: dimming it again would only separate it from the other
  // empty days.
  grid.querySelectorAll('.cell[data-d]').forEach(el =>
    mark(el, s && s.dates.has(el.dataset.d)));
}

function focusTarget(el) {
  const bar = el.closest('[data-bar]');
  if (bar) return { kind: 'batch', id: +bar.dataset.bar };
  const chip = el.closest('[data-chip]');
  if (chip) return { kind: 'credit', id: +chip.dataset.chip };
  return null;
}
function isFocus(t) { return !!focus && focus.kind === t.kind && focus.id === t.id; }
function setFocus(t) {
  if (isFocus(t)) return;
  focus = t;
  paintFocus();
}
function clearFocus() {
  if (!focus) return;
  focus = null;
  paintFocus();
}
// A focus is a claim that something exists. A batch undone or a credit archived
// elsewhere leaves the claim pointing at nothing, and a paint off it would dim
// the whole strip against a relation that is gone.
function dropStaleFocus() {
  if (!focus) return;
  const alive = focus.kind === 'credit'
    ? !!creditById(focus.id)
    : !!batchById(focus.id) || ledger.credits.some(c => c.batches.some(b => b.id === focus.id));
  if (!alive) focus = null;
}

// The far end of the relation: everything it lit bar the end the operator
// named, since that end is where he already is and cannot be what tells him the
// strip is worth moving. Naming a batch names the days its own bar runs across
// too -- they came into view with it. Everything else in the relation counts,
// a second credit on the same statement included: it answers the question the
// focus asked as well as the batch does.
function nearDates() {
  return new Set(focus.kind === 'batch' ? batchDatesOf(focus.id) : []);
}
// Read back off the paint, which has already run, so the two agree by
// construction on what is in the relation.
function farNodes() {
  const grid = document.getElementById('grid');
  const own = nearDates();
  const named = el => focus.kind === 'batch'
    ? +el.dataset.bar === focus.id || own.has(el.dataset.d)
    : +el.dataset.chip === focus.id;

    '.cell[data-d]:not(.dim)')].filter(el => !named(el));
}
// Where that far end sits on the strip. A credit is only ever on its value
// date, a batch on each of its days, so both kinds of member offer the scroll a
// row and it can take whichever is nearest.
function farDates(s) {
  const own = nearDates();
  const dates = [...s.dates].filter(d => !own.has(d));
  for (const c of ledger.credits) {
    if (s.credits.has(c.id) && !(focus.kind === 'credit' && c.id === focus.id)) {

}

  const r = el.getBoundingClientRect();

  return r.bottom > stripTop() && r.top < window.innerHeight;
}

// Nothing of the far end on screen means the relation was stated and cannot be
// seen, so the strip goes to the nearest row carrying it. Only then: a strip
// already showing the answer must not be moved out from under the operator, and
// a credit nothing has been allocated to has no far end to go to at all.
//
// Asked for by the tap that names a relation, never by a pointer resting on
// one: scrolling under a stationary pointer takes the element out from under it
// and cancels the very focus that asked for the scroll.
async function revealFocus() {
  const want = focus;

  const dates = farDates(s);
  if (!dates.length) return;
  for (const el of farNodes()) if (onScreen(el)) return;
  const rows = [...new Set(dates.map(weekIdOf))]
    .map(id => document.getElementById(id)).filter(Boolean);
  if (rows.length) {
    const edge = stripTop();
    rows.sort((a, b) => Math.abs(a.getBoundingClientRect().top - edge) -
                        Math.abs(b.getBoundingClientRect().top - edge));
    scrollToWeek(rows[0].id, true);

  // one has to be brought in before there is a row to scroll to.

  const near = d => Math.abs(new Date(d + 'T00:00:00').getTime() - mid);
  const d = dates.slice().sort((a, b) => near(a) - near(b))[0];

  // dropped the focus or moved to another one.
  if (focus !== want) return;
