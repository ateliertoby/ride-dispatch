<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>埋數 · Ride Dispatch</title>
<style>
{% include "_shared.css" %}
  /* This page has native date inputs, whose built-in widgets follow
     color-scheme rather than the tokens. */
  :root { color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; } }
  body { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
  .empty { padding: 28px 0 8px; }
  .sum-rows { padding: 8px 0 0; }
  /* Sheets here stack (day -> batch -> undo), so the head carries a back
     button and the title has to yield width to it. */
  .sheet-head { gap: 10px; }
  .sheet-title { flex: 1; min-width: 0; }
  .sheet-x, .sheet-back { flex-shrink: 0; }
  .sheet-back {
    background: var(--key-bg); border: none; border-radius: 50%;
    width: 32px; height: 32px; color: var(--text-2); cursor: pointer;
    font-size: 21px; line-height: 30px; padding: 0 2px 2px 0;
  }
  .ghost-btn:active { background: var(--key-press); }

  /* ---- month grid ---- */
  .cal { padding: 12px 14px 4px; }
  /* minmax(0, 1fr): WebKit lets a grid track grow past its share when an item
     is wider than the column, which would push the seventh day off screen. */
  .wk, .grid, .lane { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .wk { padding-bottom: 4px; }
  .wk span { text-align: center; font-size: 11px; color: var(--text-3); }
  .cell {
    position: relative; min-height: 56px; border: none; border-radius: 10px;
    background: var(--surface); cursor: pointer;
    /* The day number is a corner label pinned top-left, not part of the
       centred content, so the amount is centred in the band below it. Without
       that offset it centres against the whole cell and reads as sitting high
       with dead space underneath. */
    padding: 13px 3px 5px;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; color: inherit; min-width: 0; overflow: hidden;
  }
  .cell.pad { background: none; cursor: default; }
  /* A day with no orders carries no money and no decision, so it recedes to
     little more than a calendar coordinate. */
  .cell.none { opacity: .35; cursor: default; }
  .cell .d {
    position: absolute; top: 4px; left: 6px;
    font-size: 11px; line-height: 13px; font-weight: 600; color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }
  .cell .amt {
    font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums;
    letter-spacing: -.2px;
  }
  /* One rule: amber is money no statement has claimed yet. Money already on a
     statement is a record, so it recedes and the bar under the cell carries
     its state instead. A future day has nothing to claim yet, so it is faint. */
  .cell .amt.unsettled { color: var(--amber); }
  .cell .amt.done { color: var(--text-3); }
  .cell .amt.future { color: var(--text-3); opacity: .5; }
  .cell.today .d { color: var(--text); }
  .cell.today { box-shadow: inset 0 0 0 1px var(--text-3); }
  .cell:not(.none):not(.pad):active { background: var(--surface-press); }

  /* ---- event lanes ----
     Under each week's cells, one grid holding every batch segment and credit
     chip of that week, each placed on the lane row the packer gave it. */
  .wkblock { padding-bottom: 4px; }
  .lane { padding-top: 3px; grid-auto-rows: 18px; row-gap: 3px; }
  .bar {
    height: 18px; border-radius: 5px; border: none; padding: 0 5px; min-width: 0;
    font-family: inherit; font-size: 11px; font-weight: 650;
    font-variant-numeric: tabular-nums; letter-spacing: -.2px;
    display: flex; align-items: center; cursor: pointer;
    overflow: hidden; white-space: nowrap;
  }
  .bar.awaiting { background: var(--key-bg); color: var(--text); }
  .bar.partial { background: var(--banner-bg); color: var(--banner-fg); }
  .bar.paid { background: var(--paid-bg); color: var(--green); }
  /* A batch cut by the week boundary squares off the cut end, so the two
     segments read as one bar wrapping. */
  .bar.cut-r { border-top-right-radius: 1px; border-bottom-right-radius: 1px; }
  .bar.cut-l { border-top-left-radius: 1px; border-bottom-left-radius: 1px; }
  /* A held-back day keeps the state colour but drops the fill, so it reads as
     a pointer at the run carrying the amount rather than a batch of its own. */
  .bar.makeup { background: none; border: 1px dashed currentColor; padding: 0 3px; }
  .bar:active { filter: brightness(1.15); }
  /* A credit is an outline, not a fill: money arriving from outside the batch
     never reads as one of the bars. */
  .cchip {
    height: 18px; border-radius: 5px; background: none;
    border: 1px solid var(--green); color: var(--green);
    font-family: inherit; font-size: 10.5px; font-weight: 650;
    font-variant-numeric: tabular-nums; letter-spacing: -.2px;
    padding: 0 2px; min-width: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; white-space: nowrap;
  }
  .cchip.open { border-color: var(--amber); color: var(--amber); }
  .cchip.gone { border-color: var(--text-3); color: var(--text-3); }
  .legend { padding: 10px 2px 2px; font-size: 11px; line-height: 1.7; color: var(--text-3); }

  /* ---- sheet contents ---- */
  /* The batch sheet is read for its money on every open and for its order
     numbers only when tracing a problem, so the figure leads at hero size and
     the list sits behind a count. */
  .hero { padding: 12px 2px 10px; border-bottom: 1px solid var(--line); }
  .hero-k { font-size: 12px; color: var(--text-2); }
  .hero-v { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.5px; line-height: 1.2; }
  .hero-s { font-size: 14px; font-weight: 650; color: var(--text-2); padding-top: 2px; }
  .hero-s.paid { color: var(--green); }
  .hero-s.warn { color: var(--amber); }
  .fold {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 12px 2px; font-family: inherit; font-size: 15px; color: var(--text-2); cursor: pointer;
  }
  .fold .c { color: var(--text-3); font-size: 13px; }
  .fold:active { background: var(--surface-press); }
  .oday {
    font-size: 12px; font-weight: 650; color: var(--text-3);
    padding: 14px 2px 4px; font-variant-numeric: tabular-nums;
  }
  /* Every leg row is a read: a batch is created from a statement image in the
     bot, so there is nothing here to tick. The order number inside stays
     tappable -- that is the one thing the page is read for. */
  .orow {
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--line); padding: 11px 2px;
  }
  /* In a short-paid batch the same row is the operator's answer to which leg
     was not paid, so the whole row is the target, not just the box. */
  .orow.tick { cursor: pointer; }
  .orow.tick:active { background: var(--surface-press); }
  .ot { width: 44px; flex-shrink: 0; font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .ol { flex: 1; min-width: 0; }
  /* Reconciling is done number by number against the platform's statement, so
     the order number is the line the row is read by; the label under it only
     jogs the memory of which leg that was. Tapping the number copies it.
     Negative margins keep the digits flush with the label while the padding
     gives the tap something to land on, and wrapping anywhere keeps a
     19-digit number inside the row instead of widening the sheet. */
  .oid {
    display: inline-block; margin: 0 -6px; padding: 2px 6px 1px;
    font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums;
    letter-spacing: .2px; overflow-wrap: anywhere; cursor: pointer;
  }
  .oid:active { color: var(--text-2); }
  .oll { display: block; font-size: 11px; color: var(--text-3); }
  .oa { flex-shrink: 0; font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .omark {
    flex-shrink: 0; font-size: 11px; font-weight: 650; padding: 2px 6px; border-radius: 5px;
    background: var(--banner-bg); color: var(--banner-fg);
  }
  .oplat { color: var(--amber); font-size: 0.85em; margin-left: 4px; }
  .sum-row a { color: var(--amber); text-decoration: none; }
  /* An allocation row hands the operator to the credit that paid it, so it is
     a button wearing the same shape as the rows around it. */
  .sum-row.link {
    width: 100%; background: none; border: none; font: inherit; color: inherit;
    cursor: pointer; text-align: left;
  }
  .sum-row.link:active { background: var(--surface-press); }
  .sum-row .c { color: var(--text-3); margin-left: 6px; }
  /* In the day sheet the amount is never the answer on its own -- $500 already
     collected and $500 still owed are the same number -- so every leg carries
     its state under the amount, in the same colours the calendar uses. */
  .oend { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .otag { font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .otag.unsettled { color: var(--amber); }
  .otag.awaiting { color: var(--text); }
  .otag.paid { color: var(--green); }
  .otag.mute { color: var(--text-3); }

  /* A batch the day's legs belong to is a pointer out of the day, not a row of
     the day: it states what the whole batch is worth and hands the operator to
     it. The text is single-line so a long span cannot widen the sheet. */
  .blinks { padding-top: 6px; }
  .blink {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 48px;
    background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 12px 2px; text-align: left; cursor: pointer;
    font-family: inherit; color: var(--text-2);
  }
  .blink:active { background: var(--surface-press); }
  .blink-t {
    flex: 1; min-width: 0; font-size: 13px; font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .blink-c { flex-shrink: 0; font-size: 17px; color: var(--text-3); }

  /* ---- credit and queue sheets ---- */
  /* A note qualifies the summary row above it rather than stating a figure of
     its own, so it hangs off that row instead of starting a new one. */
  .sub-note { font-size: 12px; padding: 0 2px 8px; margin-top: -4px; }
  .sub-note.warn { color: var(--amber); }
  .sub-note.mute { color: var(--text-3); }
  /* The queue is a work list rather than a record: every row is a credit still
     to be accounted for and the way into it, so the whole row is the control. */
  .qrow {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 46px;
    background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 11px 2px; text-align: left; cursor: pointer; font-family: inherit;
    color: var(--text); font-size: 14px; font-variant-numeric: tabular-nums;
  }
  .qrow:active { background: var(--surface-press); }
  .qrow .t { flex: 1; min-width: 0; }
  .qrow .s { color: var(--amber); font-weight: 650; font-size: 13px; }
  .qrow .c { color: var(--text-3); font-size: 17px; }
  /* The count of unmatched credits in the header is the way into the queue, so
     it has to look like one without turning the summary line into a row of
     controls. */
  .sum-link {
    background: none; border: none; padding: 0; font: inherit; color: inherit;
    cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }

  /* ---- unpaid tick section ---- */
  .up-sec { padding: 12px 2px 0; }
  .up-head { font-size: 13px; font-weight: 650; color: var(--text-2); padding-bottom: 6px; }
  .up-note { font-size: 12px; color: var(--text-3); padding: 0 2px 6px; }
  .up-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-bottom: 8px; }
  .up-chips .up-note { padding-bottom: 0; }
  .up-chip {
    background: var(--key-bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 10px; font-family: inherit; font-size: 12px; color: var(--text-2);
    cursor: pointer;
  }
  .up-chip:active { background: var(--key-press); }
  .up-chk { flex-shrink: 0; font-size: 16px; line-height: 1; width: 18px; color: var(--text-2); }
  .up-chk.on { color: var(--text); }
  .up-foot {
    display: flex; align-items: center; gap: 10px; padding: 10px 2px 0;
    font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .up-foot .up-sum { flex: 1; color: var(--text-2); }
  .up-foot .up-sum.warn { color: var(--amber); }
  .up-btn {
    flex-shrink: 0; background: var(--key-bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; font-family: inherit; font-size: 13px;
    font-weight: 650; color: var(--text); cursor: pointer;
  }
  .up-btn:disabled { opacity: .35; cursor: default; }
  .up-btn:not(:disabled):active { background: var(--key-press); }

  .undo-info { padding: 12px 2px 6px; font-size: 14px; line-height: 1.7; color: var(--text-2); }

  /* ---- desktop ----
     The dashboard is phone-only. A wide screen has nothing else to show --
     every batch is read from the day it sits on -- so the width buys bigger
     cells rather than a second column. Sheets are unchanged: they stay
     phone-width bottom sheets. */
  @media (min-width: 900px) {
    body { max-width: 640px; }
    .cell { min-height: 76px; padding: 18px 5px 8px; }
    .cell .d { font-size: 12px; line-height: 14px; }
    .cell .amt { font-size: 15px; }
    .bar, .cchip { height: 22px; font-size: 13px; }
    .lane { grid-auto-rows: 22px; }
  }
</style>
</head>
<body>
<div class="header">
  <div class="header-row">
    <button class="nav-btn" id="prevM" aria-label="前一個月">&larr;</button>
    <button class="date-btn" id="monthBtn"></button>
    <button class="nav-btn" id="nextM" aria-label="後一個月">&rarr;</button>
    <a class="icon-btn" href="/" aria-label="返日程">&#10005;</a>
  </div>
  <div class="summary" id="summary"></div>
</div>
<div class="chips" id="chips"></div>
<div class="cal">
  <div class="wk"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
  <div class="weeks" id="grid"></div>
  <div id="calEmpty"></div>
  <div class="legend">條 = 結算批次（灰 等過數 · 琥珀 差數 · 綠 已收 · 虛線 補結）· 框 = 銀行入數 · 琥珀數字 = 未結算</div>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
{% include "_shared.js" %}

// ---- state ----
// One month of one platform at a time, exactly what /api/settle returns.
let data = { orders: [], settlements: [], counts: {}, totals: { unsettled: 0, awaiting: 0 }, credits: { unallocated: 0, unallocated_sum: 0 }, now: '' };
// The bank ledger, exactly what /api/credits returns: every credit of the
// platform, not the month on screen.
let ledger = { counts: { open: 0, partial: 0, done: 0, archived: 0 }, sums: { open: 0, done: 0 }, credits: [] };
let curPlat = 'ride';
let curMonth = fmtDate(new Date()).slice(0, 7);
// Settle-ability is decided against the server's clock, not the browser's, so
// the page and the API agree on which legs are done.
let NOW = '';
let TODAY = '';
let BATCH_OF = new Map();
// Which batches have their order list unfolded. Page state rather than DOM
// state, so an SSE repaint mid-read does not fold the list away.
let foldOpen = new Set();

// The operator works one platform for a stretch, so reopening lands where he
// left off. Storage can be unavailable (private mode), and the page must
// still render if it is.
function loadPlat() {
  try {
    const p = localStorage.getItem('settlePlatform');
    if (p && PLATFORMS.some(x => x.key === p)) curPlat = p;
  } catch (e) { /* no stored preference */ }
}
function savePlat() {
  try { localStorage.setItem('settlePlatform', curPlat); } catch (e) { /* not stored */ }
}

// ---- derived state ----
// JS twin of service.py:expected_of — keep in sync. Null fees count as 0.
function expectedOf(o) {
  const p = platform(o);
  if (p === 'ride') return (o.price || 0) + (o.banner_fee || 0);
  if (p === 'foodpanda') return o.price || 0;
  return (o.price || 0) + (o.tunnel_fee || 0);   // didi, uber: the toll is reimbursed
}
function orderDate(o) { return (o.scheduled_time || '').split(' ')[0]; }
function batchById(id) { return data.settlements.find(b => b.id === +id) || null; }
function creditById(id) { return ledger.credits.find(c => c.id === +id) || null; }
// The work queue: the credits no statement accounts for yet. Oldest value date
// first, the order list_credits returns -- those are the ones being chased.
function openCredits() { return ledger.credits.filter(c => c.state === 'open' || c.state === 'partial'); }
function batchOf(orderId) { return BATCH_OF.get(orderId) || null; }
function reindex() {
  // A batch can straddle months, so its own member list is the only place legs
  // outside the month on screen appear.
  BATCH_OF = new Map();
  for (const b of data.settlements) {
    for (const o of b.orders) BATCH_OF.set(o.order_id, b);
  }
}
// Mirrors db.py's settleable predicate: finished, priced, not already batched.
// Both other kinds of leg stay visible; neither can enter a batch.
function isSettleable(o) {
  return !batchOf(o.order_id) && (o.price || 0) > 0 && o.scheduled_time < NOW;
}
function ordersOn(dateStr) {
  return data.orders.filter(o => orderDate(o) === dateStr);
}
// Two numbers per day: what it earned, and how much of that no statement has
// claimed. Amber is the second one; a day fully on statements shows its total
// muted, because the bar under it carries the state.
function dayInfo(dateStr) {
  const list = ordersOn(dateStr);
  let total = 0, loose = 0;
  for (const o of list) {
    const amt = expectedOf(o);
    total += amt;
    if (!batchOf(o.order_id)) loose += amt;
  }
  return { n: list.length, total, loose };
}

// ---- labels ----
function pad2(n) { return String(n).padStart(2, '0'); }
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return fmtDate(d);
}
function mdLabel(dateStr) {
  const p = dateStr.split('-');
  return (+p[1]) + '月' + (+p[2]) + '日';
}
function mdSlash(dateStr) { return (+dateStr.slice(5, 7)) + '/' + (+dateStr.slice(8, 10)); }
function platLabel(key) { return PLATFORMS.find(p => p.key === key).label; }
function paidLabel(b) { return '已收 ' + mdSlash(b.paid_on); }
// What a batch is owed, in one phrase: a part-paid batch is neither 已收 nor
// simply 等過數 -- the outstanding half is what the operator is chasing.
function batchTag(b) {
  if (b.state === 'paid') return paidLabel(b);
  if (b.state === 'partial') return '差 $' + $(b.outstanding);
  return '等過數';
}
// Display-only shortening; the raw string stays on the order.
function shortPlace(s) {
  const t = String(s || '').replace(/[(（][^)）]*[)）]\s*$/, '').trim();
  if (/机场|機場/.test(t)) {
    const m = t.match(/T[12]/i);
    return '機場' + (m ? ' ' + m[0].toUpperCase() : '');
  }
  return t;
}
// Batches are normally whole consecutive days, so a range reads best; a
// deliberately non-contiguous batch is listed out instead of being flattened
// into a range that would claim days it does not hold.
function dateSpanLabel(dates) {
  const s = [...dates].sort();
  if (!s.length) return '';
  if (s.length === 1) return mdLabel(s[0]);
  const contiguous = s.every((d, i) => i === 0 || d === addDays(s[i - 1], 1));
  const a = s[0], z = s[s.length - 1];
  if (contiguous) {
    if (a.slice(0, 7) === z.slice(0, 7)) return (+a.slice(5, 7)) + '月' + (+a.slice(8)) + '–' + (+z.slice(8)) + '日';
    return mdLabel(a) + '–' + mdLabel(z);
  }
  if (s.length <= 3 && s.every(d => d.slice(0, 7) === a.slice(0, 7))) {
    return (+a.slice(5, 7)) + '月' + s.map(d => +d.slice(8)).join('、') + '日';
  }
  return mdLabel(a) + '–' + mdLabel(z);
}
// What the operator needs to recognise the leg on a platform statement: the
// service, plus the endpoint he actually drove to (or the flight he met).
function orderLabel(o) {
  if (platform(o) !== 'ride') return svcLabel(o.service_type);
  const svc = svcLabel(o.service_type);
  const who = o.flight_number || shortPlace(o.service_type === '送机' ? o.pickup : o.dropoff) || o.passenger_name;
  return who ? svc + ' · ' + who : svc;
}
// A 16- or 19-digit number is read off a statement in chunks, so the digits
// are grouped for the eye. Presentation only: data-copy and the clipboard
// carry the raw id. A number carrying letters is a code rather than a run of
// digits to be chunked, and a short one needs no help, so both stay as they
// are.
function groupId(id) {
  const s = String(id);
  return /^\d{9,}$/.test(s) ? s.replace(/(\d{4})(?=\d)/g, '$1\u2009') : s;
}
function batchDates(b) {
  return [...new Set(b.orders.map(orderDate))].sort();
}
// A batch's dates are not assumed contiguous: the platform holds a problem leg
// back and settles it with a later statement. The latest run is the statement's
// own days; every earlier run is a leg it picked up.
function runsOf(dates) {
  const runs = [];
  for (const d of [...dates].sort()) {
    const last = runs[runs.length - 1];
    if (last && d === addDays(last[last.length - 1], 1)) last.push(d);
    else runs.push([d]);
  }
  return runs;
}
function primaryRunOf(dates) { const r = runsOf(dates); return r[r.length - 1] || []; }
function spanLabelOf(dates) { return dateSpanLabel(primaryRunOf(dates)); }
function batchLabel(b) { return spanLabelOf(batchDates(b)); }
function runShortLabel(run) {
  const a = run[0], z = run[run.length - 1];
  if (a.slice(0, 7) !== z.slice(0, 7)) return dateSpanLabel(run);
  return (+a.slice(8)) + (a === z ? '' : '–' + (+z.slice(8))) + '日';
}
function heldLabel(b) {
  const runs = runsOf(batchDates(b)).slice(0, -1);
  if (!runs.length) return '';
  return '連 ' + runs.map(run =>
    runShortLabel(run) + ' ' + b.orders.filter(o => run.includes(orderDate(o))).length + ' 程').join(' · ');
}

// ---- load ----
async function load() {
  // The ledger comes with the month: the header counts it and the sheet lists
  // it, and a credit landing has to reach both at once.
  try {
    const [month, credits] = await Promise.all([
      fetch('/api/settle?month=' + curMonth + '&platform=' + curPlat),
      fetch('/api/credits?platform=' + curPlat),
    ]);
    if (!month.ok || !credits.ok) throw new Error('HTTP ' + month.status + '/' + credits.status);
    data = await month.json();
    ledger = await credits.json();
  } catch (e) {
    toast('載入失敗');
    return;
  }
  NOW = data.now;
  TODAY = NOW.slice(0, 10);
  reindex();
  render();
  repaintOpenView();
}

// A write here or on another device lands through load(): an open sheet has to
// show the new state, and a batch that no longer exists cannot be shown at all.
function repaintOpenView() {
  if (!views.length) return;
  views = views.filter(v => ((v.kind !== 'batch' && v.kind !== 'undo') || batchById(v.id)) &&
                            (v.kind !== 'credit' || creditById(v.id)));
  if (!views.length) { closeSheet(); return; }
  paintView();
}

// ---- render ----
function render() {
  renderHeader();
  renderChips();
  renderCalendar();
}

function renderHeader() {
  const y = +curMonth.slice(0, 4), m = +curMonth.slice(5, 7);
  document.getElementById('monthBtn').innerHTML =
    y + ' 年 ' + m + ' 月' + (curMonth === TODAY.slice(0, 7) ? '<small>今個月</small>' : '<small>&nbsp;</small>');
  // Totals span the whole book, not the month on screen: old unsettled days
  // are exactly the ones the operator is here to clear. The server computes
  // them, so the chips and the calendar cannot disagree about the same money.
  // Only what is still to be done: a matched or archived credit is finished
  // business and is read off the calendar by its value date instead.
  const open = openCredits();
  document.getElementById('summary').innerHTML =
    '未結算 <span class="warn">$' + $(data.totals.unsettled) + '</span> · 等過數 $' + $(data.totals.awaiting) +
    (open.length ? ' · <button class="sum-link" data-credits="1">入數未對 ' + open.length +
      ' 筆 $' + $(ledger.sums.open) + '</button>' : '');
}

function renderChips() {
  document.getElementById('chips').innerHTML = PLATFORMS.map(p => {
    const n = data.counts[p.key] || 0;
    const on = curPlat === p.key;
    return '<button class="chip' + (on ? ' on' : (n ? '' : ' zero')) + '" data-f="' + p.key + '">' +
      esc(p.label) + ' ' + n + '</button>';
  }).join('');
}

function cellHtml(dateStr) {
  if (!dateStr) return '<div class="cell pad"></div>';
  const day = +dateStr.slice(8);
  const info = dayInfo(dateStr);
  const today = dateStr === TODAY ? ' today' : '';
  // Only an empty day is inert; every day holding work opens, past or future.
  if (!info.n) return '<button class="cell none' + today + '" disabled><span class="d">' + day + '</span></button>';
  const future = dateStr > TODAY;
  const cls = future ? 'future' : (info.loose > 0 ? 'unsettled' : 'done');
  const amt = future ? info.total : (info.loose > 0 ? info.loose : info.total);
  return '<button class="cell' + today + '" data-d="' + dateStr + '">' +
    '<span class="d">' + day + '</span><span class="amt ' + cls + '">$' + $(amt) + '</span></button>';
}

function monthWeeks() {
  const y = +curMonth.slice(0, 4), m = +curMonth.slice(5, 7);
  const lead = new Date(y, m - 1, 1).getDay();
  const days = new Date(y, m, 0).getDate();
  const weeks = [];
  let w = new Array(lead).fill(null);
  for (let d = 1; d <= days; d++) {
    w.push(curMonth + '-' + pad2(d));
    if (w.length === 7) { weeks.push(w); w = []; }
  }
  if (w.length) { while (w.length < 7) w.push(null); weeks.push(w); }
  return weeks;
}

// Each run of a batch is laid out on its own and cut again at the week
// boundary, so a segment is the unit both the grid and the lane packer see.
// Batches come before credits so a bar is never pushed under a chip.
function weekEvents(week) {
  const idx = new Map();
  week.forEach((d, i) => { if (d) idx.set(d, i); });
  const out = [];
  for (const b of data.settlements) {
    const runs = runsOf(batchDates(b));
    const point = runs[runs.length - 1][0];
    runs.forEach((run, ri) => {
      const cols = run.filter(d => idx.has(d)).map(d => idx.get(d));
      if (!cols.length) return;
      const start = Math.min(...cols), end = Math.max(...cols);
      out.push({
        type: 'bar', start, span: end - start + 1, batch: b,
        makeup: ri < runs.length - 1, point, from: run[0],
        // The label rides the run's first segment only, so a wrapped bar is
        // not read as two batches of the same amount.
        head: idx.get(run[0]) === start,
        // Squared off whenever the run carries on past this segment: into the
        // next week, or off the edge of the month on screen, which is where a
        // batch straddling two months leaves its other half.
        cutR: run[run.length - 1] > week[end],
        cutL: run[0] < week[start],
      });
    });
  }
  for (const c of ledger.credits) {
    if (!idx.has(c.value_date)) continue;
    out.push({ type: 'chip', start: idx.get(c.value_date), span: 1, credit: c });
  }
  return out;
}

function packLanes(events) {
  const lanes = [];
  for (const e of events) {
    let li = lanes.findIndex(lane => lane.every(x =>
      e.start > x.start + x.span - 1 || e.start + e.span - 1 < x.start));
    if (li < 0) { lanes.push([]); li = lanes.length - 1; }
    lanes[li].push(e);
  }
  return lanes;
}

// A 補結 segment carries no amount: it points at the run that does.
function makeupLabel(point, from) {
  return '&rarr;' + (point.slice(0, 7) === from.slice(0, 7) ? (+point.slice(8)) + '日' : mdSlash(point));
}

function eventHtml(e, lane) {
  // Both axes are explicit: grid auto-placement is sparse and never moves
  // backwards, so an item whose column precedes its predecessor's would be
  // pushed to a new row and the lane would silently stop being one row.
  const pos = ' style="grid-column:' + (e.start + 1) + '/span ' + e.span + ';grid-row:' + (lane + 1) + '"';
  if (e.type === 'bar') {
    const b = e.batch;
    const cls = ['bar', b.state];
    if (e.makeup) cls.push('makeup');
    if (e.cutR) cls.push('cut-r');
    if (e.cutL) cls.push('cut-l');
    const label = !e.head ? '' : e.makeup ? makeupLabel(e.point, e.from) : '$' + $(b.confirmed_amount);
    return '<button class="' + cls.join(' ') + '"' + pos + ' data-bar="' + b.id + '">' + label + '</button>';
  }
  const c = e.credit;
  const cls = 'cchip' + (c.state === 'done' ? '' : c.state === 'archived' ? ' gone' : ' open');
  return '<button class="' + cls + '"' + pos + ' data-chip="' + c.id + '">入$' + $(c.amount) + '</button>';
}

function renderCalendar() {
  const html = monthWeeks().map(week => {
    const lanes = packLanes(weekEvents(week));
    return '<div class="wkblock"><div class="grid">' + week.map(cellHtml).join('') + '</div>' +
      (lanes.length ? '<div class="lane">' +
        lanes.map((lane, li) => lane.map(e => eventHtml(e, li)).join('')).join('') + '</div>' : '') +
      '</div>';
  }).join('');
  document.getElementById('grid').innerHTML = html;
  document.getElementById('calEmpty').innerHTML =
    data.orders.length ? '' : '<div class="empty">呢個月冇紀錄</div>';
}

// ---- sheet ----
// Sheets stack instead of replacing each other: a batch reached from a day has
// to hand the operator back to that day, not to the calendar.
let views = [];
function curView() { return views[views.length - 1] || null; }
function viewHtml(v) {
  if (v.kind === 'day') return dayViewHtml(v);
  if (v.kind === 'undo') return undoViewHtml(v);
  if (v.kind === 'credit') return creditViewHtml(v);
  if (v.kind === 'queue') return queueViewHtml();
  return batchViewHtml(v);
}
// keepScroll is for a repaint the operator asked for from inside the sheet
// (unfolding a list): the sheet is where he was reading, so it must not jump
// back to the top under him.
function paintView(keepScroll) {
  const v = curView();
  if (!v) return;
  const el = document.getElementById('sheet');
  const top = keepScroll ? el.scrollTop : 0;
  el.innerHTML = '<div class="grab"></div>' + viewHtml(v);
  el.scrollTop = top;
  el.classList.add('show');
  document.getElementById('scrim').classList.add('show');
}
function openView(v) { views = [v]; paintView(); }
function pushView(v) { views.push(v); paintView(); }
function popView() {
  views.pop();
  if (views.length) paintView(); else closeSheet();
}
function closeSheet() {
  views = [];
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('scrim').classList.remove('show');
}
function sheetHead(title, sub) {
  return '<div class="sheet-head">' +
    (views.length > 1 ? '<button class="sheet-back" data-back="1" aria-label="返上一層">&#8249;</button>' : '') +
    '<div class="sheet-title">' + title + '</div>' +
    '<button class="sheet-x" data-close="1">&#10005;</button></div>' +
    (sub ? '<div class="sheet-sub">' + sub + '</div>' : '');
}

// One row shape for every sheet. The mode decides what the right-hand end
// says: 'day' states where the leg's money has got to, 'batch' shows the
// platform's own figure beside the system's. A tick option turns the batch row
// into the operator's answer to which leg the platform has not paid; without
// it the row is a read, since a batch is created from a statement image in the
// bot, never from here.
function orderRowHtml(o, mode, opts) {
  const tick = opts && opts.tick;
  let right;
  if (mode === 'day') {
    const tag = dayTag(o);
    const amt = expectedOf(o);
    right = '<span class="oend">' + (amt ? '<span class="oa">$' + $(amt) + '</span>' : '') +
      '<span class="otag ' + tag[1] + '">' + esc(tag[0]) + '</span></span>';
  } else if (tick) {
    // The figure to tick against is the platform's, because the outstanding
    // amount the ticks have to add up to is the platform's own arithmetic.
    right = '<span class="oend"><span class="oa">$' + $(o.platform_amount) + '</span>' +
      (opts.ticked ? '<span class="otag unsettled">未過數</span>' : '') + '</span>';
  } else {
    const plat = opts && opts.plat;
    const mark = !o.price ? '未入價' : (o.scheduled_time >= NOW ? '未完成' : '');
    // In batch detail the platform's own figure is shown when it disagrees;
    // an equal figure would only repeat the number.
    const platNote = plat !== undefined && Math.abs(plat - expectedOf(o)) >= 0.005
      ? ' · <span class="oplat">平台 $' + $(plat) + '</span>' : '';
    right = mark ? '<span class="omark">' + mark + '</span>'
                 : '<span class="oa">$' + $(expectedOf(o)) + platNote + '</span>';
  }
  const chk = tick
    ? '<span class="up-chk' + (opts.ticked ? ' on' : '') + '">' + (opts.ticked ? '☑' : '☐') + '</span>' : '';
  return '<div class="orow' + (tick ? ' tick" data-uptick="' + esc(o.order_id) + '"' : '"') + '>' + chk +
    '<span class="ot">' + esc(orderTime(o)) + '</span>' +
    '<span class="ol">' +
      '<span class="oid" data-copy="' + esc(o.order_id) + '">' + esc(groupId(o.order_id)) + '</span>' +
      '<span class="oll">' + esc(orderLabel(o)) + '</span></span>' +
    right + '</div>';
}

// Grouped by day whenever the batch holds more than one, because each day is a
// page of the statement the batch was read from. A tick set turns every row
// into a tick row.
function orderListHtml(b, rows, tickSet) {
  const plat = new Map();
  (b.statement ? b.statement.days.flatMap(d => d.rows) : []).forEach(r =>
    plat.set(r.order_id, (plat.get(r.order_id) || 0) + r.amount));
  const row = o => orderRowHtml(o, 'batch', tickSet
    ? { tick: true, ticked: tickSet.has(o.order_id) } : { plat: plat.get(o.order_id) });
  const dates = batchDates(b);
  if (dates.length === 1) return rows.map(row).join('');
  return dates.map(d => '<div class="oday">' + esc(mdLabel(d)) + ' 星期' + weekday(d) + '</div>' +
    rows.filter(o => orderDate(o) === d).map(row).join('')).join('');
}

// ---- day sheet ----
// A read of the day: what it earned, where each leg's money has got to, and
// the batches it belongs to. Nothing is written from here.
function dayTag(o) {
  const b = batchOf(o.order_id);
  if (b) return b.state === 'paid' ? [paidLabel(b), 'paid'] : [batchTag(b), 'awaiting'];
  if (isSettleable(o)) return ['未結算', 'unsettled'];
  return [o.price ? '未完成' : '未入價', 'mute'];
}
function batchesOn(dateStr) {
  const seen = new Set();
  const out = [];
  for (const o of ordersOn(dateStr)) {
    const b = batchOf(o.order_id);
    if (b && !seen.has(b.id)) { seen.add(b.id); out.push(b); }
  }
  return out;
}
function openDay(dateStr) {
  openView({ kind: 'day', date: dateStr });
}

function dayViewHtml(v) {
  const batches = batchesOn(v.date);
  return sheetHead(esc(mdLabel(v.date)) + ' 星期' + weekday(v.date), esc(platLabel(curPlat))) +
    ordersOn(v.date).map(o => orderRowHtml(o, 'day')).join('') +
    (batches.length ? '<div class="blinks">' + batches.map(b =>
      '<button class="blink" data-bl="' + b.id + '"><span class="blink-t">批次 ' +
      esc(batchLabel(b)) + ' · ' + b.orders.length + ' 程 · $' + $(b.confirmed_amount) +
      ' · ' + batchTag(b) + (heldLabel(b) ? ' · ' + esc(heldLabel(b)) : '') + '</span>' +
      '<span class="blink-c">&rsaquo;</span></button>').join('') + '</div>' : '');
}

// ---- batch sheet ----
// Read money first: the confirmed figure and where its payment has got to are
// what the sheet is opened for. The order numbers are only read when tracing a
// problem, so they fold away -- except in a short-paid batch, where the same
// list is where the operator names the leg that was not paid.
function legLabel(o) {
  return (+orderDate(o).slice(8)) + '日 ' + orderTime(o) + ' ' + orderLabel(o);
}
// A guess of more than two legs is a sum, not a list: naming four legs in a
// chip is unreadable, while the count and the total are enough to choose by.
function guessLabel(ids, b) {
  const legs = ids.map(id => b.orders.find(o => o.order_id === id)).filter(Boolean);
  if (legs.length > 2) return legs.length + ' 程 $' + $(legs.reduce((sum, o) => sum + o.platform_amount, 0));
  return legs.map(legLabel).join(' + ');
}

function batchViewHtml(v) {
  const b = batchById(v.id);
  if (!b) return '';
  const rows = b.orders.slice().sort((x, y) => x.scheduled_time.localeCompare(y.scheduled_time));
  const diff = b.confirmed_amount - b.expected_amount;
  // A batch is not paid or unpaid but owed a figure: what the bank has sent
  // and what it still owes are two different numbers until the last one lands.
  let state;
  if (b.state === 'paid') state = '<div class="hero-s paid">已收齊 · ' + mdSlash(b.paid_on) + '</div>';
  else if (b.state === 'partial') state = '<div class="hero-s warn">已收 $' + $(b.received) +
    '（' + mdSlash(b.allocations[b.allocations.length - 1].value_date) + '） · 差 $' + $(b.outstanding) + '</div>';
  else state = '<div class="hero-s">等過數</div>';

  const sums = ['<div class="sum-row"><span class="k">應收</span><span class="v">$' + $(b.expected_amount) + '</span></div>'];
  if (diff) sums.push('<div class="sum-row"><span class="k">差額</span><span class="v">' +
    (diff < 0 ? '&minus;' : '+') + '$' + $(Math.abs(diff)) + '</span></div>');
  b.allocations.forEach(a => sums.push('<button class="sum-row link" data-credit="' + a.credit_id + '">' +
    '<span class="k">入數 ' + mdSlash(a.value_date) + '</span>' +
    '<span class="v">$' + $(a.amount) + '<span class="c">&rsaquo;</span></span></button>'));
  if (b.statement) {
    // Platform amount per order id, 舉牌 lines folded in (same fold as reconcile()).
    const inBatch = new Set(b.orders.map(o => o.order_id));
    const plat = new Map();
    b.statement.days.flatMap(d => d.rows).forEach(r => plat.set(r.order_id, (plat.get(r.order_id) || 0) + r.amount));
    [...plat.keys()].filter(id => !inBatch.has(id)).forEach(id =>
      sums.push('<div class="sum-row"><span class="k">平台多出 ' + esc(groupId(id)) +
        '</span><span class="v">$' + $(plat.get(id)) + '</span></div>'));
    if (b.statement_image) sums.push('<div class="sum-row"><span class="k">結算單</span><span class="v">' +
      '<a href="/api/settlements/' + b.id + '/image" target="_blank" rel="noopener">睇圖</a></span></div>');
  }

  let mid;
  if (b.state === 'partial') {
    // Pre-tick: existing marks win; else if exactly one guess, pre-tick that.
    const ticked = new Set(b.orders.filter(o => o.unpaid).map(o => o.order_id));
    const guesses = b.unpaid_guesses || [];
    if (!ticked.size && guesses.length === 1) guesses[0].forEach(id => ticked.add(id));
    let note;
    if (guesses.length === 1) note = '<div class="up-note">系統估：' + esc(guessLabel(guesses[0], b)) + '，啱差額，已剔</div>';
    else if (guesses.length > 1) note = '<div class="up-chips"><span class="up-note">系統估：</span>' +
      guesses.map((g, i) => '<button class="up-chip" data-upguess="' + i + '">' +
        esc(guessLabel(g, b)) + '</button>').join('') + '</div>';
    else note = '<div class="up-note">冇組合啱 $' + $(b.outstanding) + '，自己剔</div>';
    const tickedAmt = rows.reduce((sum, o) => ticked.has(o.order_id) ? sum + o.platform_amount : sum, 0);
    const match = Math.abs(tickedAmt - b.outstanding) < 0.005;
    mid = '<div class="up-sec" data-upbatch="' + b.id + '">' +
      '<div class="up-head">邊張單未過？ · 差 $' + $(b.outstanding) + '</div>' + note +
      orderListHtml(b, rows, ticked) +
      '<div class="up-foot"><span class="up-sum' + (match ? '' : ' warn') + '">' +
      esc(tickFootText(tickedAmt, b)) + '</span>' +
      '<button class="up-btn" data-upsave="' + b.id + '"' + (match ? '' : ' disabled') +
      '>記低</button></div></div>';
  } else {
    const open = foldOpen.has(b.id);
    mid = '<button class="fold" data-fold="' + b.id + '"><span>' + b.orders.length + ' 程</span>' +
      '<span class="c">' + (open ? '&#9662;' : '&#9656;') + '</span></button>' +
      (open ? orderListHtml(b, rows, null) : '');
  }

  const held = heldLabel(b);
  return sheetHead('結算 ' + esc(batchLabel(b)),
      esc(platLabel(b.platform)) + ' · ' + b.orders.length + ' 程 · 結算日 ' + mdSlash(b.settled_on) +
      (held ? ' · ' + esc(held) : '')) +
    '<div class="hero"><div class="hero-k">平台確認</div>' +
    '<div class="hero-v">$' + $(b.confirmed_amount) + '</div>' + state + '</div>' +
    '<div class="sum-rows">' + sums.join('') + '</div>' +
    mid +
    '<button class="ghost-btn danger" data-undo="' + b.id + '">撤銷結算</button>' +
    '<button class="ghost-btn" data-back="1">收埋</button>';
}

// ---- credit sheet ----
// One bank credit: how much arrived, who sent it, and which batch it was read
// against. The batch row hands the operator on to that batch, and says what it
// is still owed, because a credit covering a batch in full is not the same as
// one that left it short.
function creditViewHtml(v) {
  const c = creditById(v.id);
  if (!c) return '';
  let state, extra = '';
  if (c.state === 'done') state = '<div class="hero-s paid">已對</div>';
  else if (c.state === 'partial') state = '<div class="hero-s warn">已對 $' + $(c.allocated) +
    ' · 剩 $' + $(c.remaining) + '</div>';
  else if (c.state === 'open') {
    state = '<div class="hero-s warn">未對</div>';
    extra = '<div class="sub-note mute">冇 statement 對得上</div>';
  } else state = '<div class="hero-s">收埋' +
    (c.archived_reason ? '（' + esc(c.archived_reason) + '）' : '') + '</div>';
  // The label comes from the entry's own dates: the batch itself can sit in a
  // month the page has not loaded.
  const rows = c.batches.map(b =>
    '<button class="sum-row link" data-bl="' + b.id + '">' +
    '<span class="k">批次 ' + esc(spanLabelOf(b.dates)) + '</span>' +
    '<span class="v">' + b.orders + ' 程 · $' + $(b.amount) + '<span class="c">&rsaquo;</span></span></button>' +
    (b.state === 'partial' ? '<div class="sub-note warn">批次仲差 $' + $(b.outstanding) + '</div>' : ''));
  rows.push('<div class="sum-row"><span class="k">Ref</span><span class="v">' + esc(c.ref) + '</span></div>');
  if (c.memo) rows.push('<div class="sum-row"><span class="k">備註</span><span class="v">' +
    esc(c.memo) + '</span></div>');
  // /api/credits scopes the ledger to one platform rather than stamping each
  // credit with it, so the platform on screen is the credit's platform.
  return sheetHead('入數 ' + esc(mdLabel(c.value_date)),
      esc(platLabel(curPlat)) + (c.payer ? ' · ' + esc(c.payer) : '')) +
    '<div class="hero"><div class="hero-k">到帳</div>' +
    '<div class="hero-v">$' + $(c.amount) + '</div>' + state + '</div>' +
    extra +
    '<div class="sum-rows">' + rows.join('') + '</div>' +
    '<button class="ghost-btn" data-back="1">收埋</button>';
}

// Only the work queue is a list: a matched or archived credit is found on the
// calendar by its value date, so listing it again would only bury the ones
// still waiting for a statement.
function queueViewHtml() {
  const open = openCredits();
  return sheetHead('入數未對', esc(platLabel(curPlat)) + ' · ' + open.length + ' 筆 $' + $(ledger.sums.open)) +
    (open.length ? '' : '<div class="empty">冇未對嘅入數</div>') +
    open.map(c => '<button class="qrow" data-credit="' + c.id + '">' +
      '<span class="t">' + esc(mdSlash(c.value_date)) + ' · $' + $(c.amount) + '</span>' +
      '<span class="s">未對' + (c.state === 'partial' ? ' · 剩 $' + $(c.remaining) : '') + '</span>' +
      '<span class="c">&rsaquo;</span></button>').join('') +
    '<button class="ghost-btn" data-back="1">收埋</button>';
}

// Undo is destructive enough to confirm, and confirming in a pushed view
// rather than an armed button means a refresh mid-decision cannot wipe the
// armed state.
function undoViewHtml(v) {
  const b = batchById(v.id);
  if (!b) return '';
  return sheetHead('撤銷結算', esc(batchLabel(b)) + ' · ' + b.orders.length + ' 程') +
    '<div class="undo-info">呢 ' + b.orders.length + ' 程會變返未結算，' +
      '$' + $(b.confirmed_amount) + ' 嘅結算紀錄會刪走。</div>' +
    '<button class="primary-btn danger" data-undogo="' + b.id + '">確認撤銷</button>' +
    '<button class="ghost-btn" data-back="1">返回</button>';
}

// ---- actions ----

// Undo returns the legs to unsettled rather than flagging the batch: an
// unbatched order is already the "not settled" state, so a mistake costs
// nothing to unwind and the days simply go amber again.
async function undoBatch(id) {
  try {
    await apiWrite('DELETE', '/api/settlements/' + id);
  } catch (e) {
    toast(e.message);
    return;
  }
  // The batch the sheet was showing no longer exists, so it closes back to the
  // day, where its legs are loose again.
  while (views.length && (curView().kind === 'undo' || curView().kind === 'batch')) views.pop();
  await load();
  toast('已撤銷結算');
}

// A credit's batch can sit outside the month on screen, and the batch sheet
// reads from the month. Move the calendar to it first, or the sheet opens on
// nothing.
async function openBatch(id) {
  if (!batchById(id)) {
    const b = ledger.credits.flatMap(c => c.batches).find(x => x.id === id);
    const month = b && b.dates.length ? b.dates[b.dates.length - 1].slice(0, 7) : '';
    if (!month || month === curMonth) return;
    curMonth = month;
    await load();
    if (!batchById(id)) return;
  }
  pushView({ kind: 'batch', id: id });
}

function copyId(id) {
  // The async clipboard can be refused depending on where the page is served
  // from; the toast is the feedback either way.
  if (navigator.clipboard) navigator.clipboard.writeText(id).catch(() => {});
  toast('已複製 ' + id);
}

// ---- events ----
function shiftMonth(n) {
  const y = +curMonth.slice(0, 4), m = +curMonth.slice(5, 7) + n;
  curMonth = m < 1 ? (y - 1) + '-12' : m > 12 ? (y + 1) + '-01' : y + '-' + pad2(m);
  load();
}
document.getElementById('prevM').addEventListener('click', () => shiftMonth(-1));
document.getElementById('nextM').addEventListener('click', () => shiftMonth(1));
document.getElementById('monthBtn').addEventListener('click', () => {
  if (!TODAY || curMonth === TODAY.slice(0, 7)) return;
  curMonth = TODAY.slice(0, 7);
  load();
});
document.getElementById('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c || c.dataset.f === curPlat) return;
  curPlat = c.dataset.f;
  savePlat();
  load();
});
document.getElementById('summary').addEventListener('click', e => {
  if (e.target.closest('[data-credits]')) openView({ kind: 'queue' });
});
document.getElementById('grid').addEventListener('click', e => {
  const bar = e.target.closest('[data-bar]');
  if (bar) { openView({ kind: 'batch', id: +bar.dataset.bar }); return; }
  const chip = e.target.closest('[data-chip]');
  if (chip) { openView({ kind: 'credit', id: +chip.dataset.chip }); return; }
  const cell = e.target.closest('.cell');
  if (cell && cell.dataset.d) openDay(cell.dataset.d);
});
document.getElementById('scrim').addEventListener('click', closeSheet);
document.getElementById('sheet').addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { closeSheet(); return; }
  if (e.target.closest('[data-back]')) { popView(); return; }
  // Before the row: the order number sits inside a row that would otherwise
  // treat the tap as a toggle.
  const cp = e.target.closest('[data-copy]');
  if (cp) { copyId(cp.dataset.copy); return; }
  const undo = e.target.closest('[data-undo]');
  if (undo) { pushView({ kind: 'undo', id: +undo.dataset.undo }); return; }
  const undoGo = e.target.closest('[data-undogo]');
  if (undoGo) { undoBatch(undoGo.dataset.undogo); return; }
  const tick = e.target.closest('[data-uptick]');
  if (tick) { toggleUnpaid(tick.dataset.uptick); return; }
  const guess = e.target.closest('[data-upguess]');
  if (guess) { applyGuess(+guess.dataset.upguess); return; }
  const save = e.target.closest('[data-upsave]');
  if (save && !save.disabled) { saveUnpaid(+save.dataset.upsave); return; }
  const fold = e.target.closest('[data-fold]');
  if (fold) {
    const id = +fold.dataset.fold;
    foldOpen.has(id) ? foldOpen.delete(id) : foldOpen.add(id);
    paintView(true);
    return;
  }
  const cr = e.target.closest('[data-credit]');
  if (cr) { pushView({ kind: 'credit', id: +cr.dataset.credit }); return; }
  const link = e.target.closest('[data-bl]');
  if (link) { openBatch(+link.dataset.bl); return; }
});

// ---- unpaid tick interaction ----
// The tick state lives in the DOM: toggling repaints only the section rather
// than the whole sheet, so scroll position and the rest of the view survive.
function getTickedIds() {
  const sec = document.querySelector('[data-upbatch]');
  if (!sec) return new Set();
  return new Set([...sec.querySelectorAll('.up-chk.on')].map(
    el => el.closest('[data-uptick]').dataset.uptick));
}
// A row's tag mirrors its box, so a ticked leg already reads 未過數 the way it
// will once the save has round-tripped.
function setTickRow(row, on) {
  const chk = row.querySelector('.up-chk');
  chk.classList.toggle('on', on);
  chk.textContent = on ? '☑' : '☐';
  const end = row.querySelector('.oend');
  const tag = end.querySelector('.otag');
  if (on && !tag) end.insertAdjacentHTML('beforeend', '<span class="otag unsettled">未過數</span>');
  if (!on && tag) tag.remove();
}
function toggleUnpaid(orderId) {
  const sec = document.querySelector('[data-upbatch]');
  if (!sec) return;
  const bid = +sec.dataset.upbatch;
  const b = batchById(bid);
  if (!b) return;
  const row = sec.querySelector('[data-uptick="' + orderId + '"]');
  if (!row) return;
  setTickRow(row, !row.querySelector('.up-chk').classList.contains('on'));
  refreshUnpaidFoot(sec, b);
}
function applyGuess(idx) {
  const sec = document.querySelector('[data-upbatch]');
  if (!sec) return;
  const bid = +sec.dataset.upbatch;
  const b = batchById(bid);
  if (!b) return;
  const guessIds = new Set((b.unpaid_guesses || [])[idx] || []);
  sec.querySelectorAll('[data-uptick]').forEach(row => {
    const want = guessIds.has(row.dataset.uptick);
    if (want !== row.querySelector('.up-chk').classList.contains('on')) setTickRow(row, want);
  });
  refreshUnpaidFoot(sec, b);
}
// One phrasing for the footer, so the first paint and every toggle after it
// cannot drift apart.
function tickFootText(amt, b) {
  return Math.abs(amt - b.outstanding) < 0.005
    ? '剔咗 $' + $(amt) + ' = 差額'
    : '剔咗 $' + $(amt) + ' ≠ 差 $' + $(b.outstanding);
}
function refreshUnpaidFoot(sec, b) {
  const ticked = getTickedIds();
  let amt = 0;
  b.orders.forEach(o => { if (ticked.has(o.order_id)) amt += o.platform_amount; });
  amt = Math.round(amt * 100) / 100;
  const match = Math.abs(amt - b.outstanding) < 0.005;
  const foot = sec.querySelector('.up-foot');
  const sumEl = foot.querySelector('.up-sum');
  sumEl.className = match ? 'up-sum' : 'up-sum warn';
  sumEl.textContent = tickFootText(amt, b);
  foot.querySelector('.up-btn').disabled = !match;
}
async function saveUnpaid(bid) {
  const ticked = [...getTickedIds()];
  try {
    await apiWrite('POST', '/api/settlements/' + bid + '/unpaid', { order_ids: ticked });
  } catch (e) {
    toast(e.message);
    return;
  }
  await load();
  toast('已記低');
}

// ---- init ----
loadPlat();
load();
const es = new EventSource('/api/events');
es.onmessage = () => load();
</script>
</body>
</html>
